  const all = [...seenStatuses.map(s => s.value), ...selected.filter(s => !seenStatuses.some(x => x.value === s))];
  return all.map(s => {
    const seen = seenStatuses.find(x => x.value === s);
    return `<label><input type="checkbox" ${selected.includes(s) ? "checked" : ""} onchange="toggleStatusIn('${listKey}', ${jsArg(s)})"> ${esc(s)} <span class="count">${seen ? `${seen.count} ticket${seen.count === 1 ? "" : "s"}` : "not seen in current tickets"}</span></label>`;
  }).join("");
}
// ---- Admin: daily goals per role (entered in hours, stored in minutes) ----
const hoursText = sec => { const h = sec / 3600; return String(Math.round(h * 100) / 100); };
function parseHours(v) {
  const n = Number(String(v).trim().replace(/h(ours?)?$/i, "").trim());
  return Number.isFinite(n) && n >= 0 && n <= 24 ? Math.round(n * 60) : null;
}
function setRoleGoal(pos, field, val) {
  const g = GOALS[pos];
  const mins = parseHours(val);
  if (mins == null) { showToast("Enter hours, like 5 or 4.5", "error"); render(); return; }
  const book = field === "book" ? mins : Math.round(g.book / 60);
  const actual = field === "actual" ? mins : Math.round(g.spent / 60);
  mutate("/admin/role-goal", { position: pos, book, actual }, () => { GOALS[pos] = { book: book * 60, spent: actual * 60 }; });
}
function toggleRoleGoal(pos, on) {
  mutate("/admin/role-goal", on ? { position: pos, book: 240, actual: 240 } : { position: pos, book: null },
    () => { GOALS[pos] = on ? { book: 4 * 3600, spent: 4 * 3600 } : null; });
}
function renderAdminGoals() {
  const rows = POSITIONS.map(pos => {
    const g = GOALS[pos];
    const inp = (field, sec) => `<input class="booktime-input" style="width:64px" type="text" inputmode="decimal" value="${esc(hoursText(sec))}" onchange="setRoleGoal(${jsArg(pos)}, '${field}', this.value)"> h`;
    return `<tr>
      <td><b>${esc(pos)}</b></td>
      <td><label class="role-check"><input type="checkbox" ${g ? "checked" : ""} onchange="toggleRoleGoal(${jsArg(pos)}, this.checked)"> Has a goal</label></td>
      <td>${g ? inp("book", g.book) : `<span class="meter-note">—</span>`}</td>
      <td>${g ? inp("actual", g.spent) : `<span class="meter-note">—</span>`}</td>
    </tr>`;
  }).join("");
  return `
    ${backCrumb()}
    <div class="panel">
      <h2>🎯 Daily goals by role</h2>
      <div class="meter-note" style="margin-bottom:10px">What each role aims for per day. Type hours (5, 4.5, 2.25). Changes show for everyone within ~15 seconds — including people already logged in today.</div>
      <table>
        <thead><tr><th>Role</th><th></th><th class="h-book">📖 Book time goal</th><th class="h-actual">⏱ Actual time goal</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}
function setDiagMinTotal(val) {
  const v = Math.max(0, Math.round(Number(String(val).replace(/[^0-9.]/g, "")) || 0));
  mutate("/admin/diag-min-total", { value: v }, () => { state.diagMinRepairTotal = v; });
}
function copyRaw() {
  const el = document.getElementById("rs-raw");
  if (!el) return;
  navigator.clipboard?.writeText(el.textContent).then(() => showToast("Copied"), () => showToast("Couldn't copy — select it by hand", "error"));
}
function renderAdminRs() {
  const c = state.rsCheck;
  const seenStatuses = c && c.statuses ? c.statuses : [];
  const statusChecks = renderStatusChecklist("diagnosis", seenStatuses);
  const queueChecks = renderStatusChecklist("queue", seenStatuses);
  const issueRows = c && c.issueTypes ? c.issueTypes.map(it => `
    <label>${ISSUE_TYPE_TO_DEVICE[it.value] ? `<span class="ok-text">✓</span>` : `<span class="bad-text">–</span>`} ${esc(it.value)} <span class="count">${it.count} · ${ISSUE_TYPE_TO_DEVICE[it.value] ? `→ ${esc(ISSUE_TYPE_TO_DEVICE[it.value].category)} / ${esc(ISSUE_TYPE_TO_DEVICE[it.value].subtype)}` : "no book-time mapping (tech sets it by hand)"}</span></label>`).join("") : "";
  return `
    ${renderDefaultKeyPanel()}
    ${renderTimerPanel()}
    <div class="panel">
      <h2>💰 Team tab</h2>
      <label class="sort-option"><input type="checkbox" id="show-money" ${state.showMoney ? "checked" : ""} onchange="setShowMoney(this.checked)"> Show "Today's money" (payments + invoiced today) at the top of the Team tab — everyone who can open the Team tab sees it</label>
    </div>
    <div class="panel">
      <h2>RepairShopr connection</h2>
      <div style="margin-bottom:12px"><button class="btn primary small" onclick="runRsCheck()" ${state.rsCheckLoading ? "disabled" : ""}>${state.rsCheckLoading ? "Checking…" : "Run check"}</button></div>
      ${c ? `
        <div style="margin-bottom:10px; font-size:13px">${c.ok ? `<span class="ok-text">✓ Connected</span> — ${c.ticketCount} open/resolved-today tickets pulled${c.openMeta ? ` (RS says ${esc(c.openMeta.total_entries)} open across ${esc(c.openMeta.total_pages)} pages)` : ""}, ${c.users ? c.users.length : 0} RS users.` : `<span class="bad-text">✗ Problem</span>`}</div>
        ${c.errors && c.errors.length ? `<div class="rs-warning">${c.errors.map(esc).join("<br>")}</div>` : ""}
      ` : `<div class="meter-note">Pulls tickets + users from RepairShopr right now and shows what came back.</div>`}
    </div>
    <div class="panel">
      <h2>"In the queue" statuses</h2>
      <div class="meter-note">Only tickets in a checked status show under "Your assigned tickets" on My Day. ${c ? "" : "Run the check above to list every status your open tickets are actually in."}</div>
      <div class="check-list">${queueChecks || `<span class="meter-note">None set.</span>`}</div>
    </div>
    <div class="panel">
      <h2>Diagnosis-credit statuses</h2>
      <div class="meter-note">When a tech's ticket moves from an "in the queue" status into a checked status, My Day asks them "Is the diagnosis 100% completed?". Diagnosis credit can only ever be claimed once per ticket. ${c ? "" : "Run the check above to list every status your open tickets are actually in."}</div>
      <div class="check-list">${statusChecks || `<span class="meter-note">None set.</span>`}</div>
      <div style="font-size:13px; padding-top:10px; border-top:1px solid var(--grid)">
        Minimum repair total needed to collect a diagnosis credit <b>and</b> a repair credit on the same ticket:
        $<input id="diag-min-input" class="booktime-input" style="width:70px" type="text" inputmode="numeric" value="${esc(state.diagMinRepairTotal)}" onchange="setDiagMinTotal(this.value)">
        <div class="meter-note">Under this, the diagnosis credit is still taken but worth 0m.</div>
      </div>
    </div>
    ${c && c.issueTypes ? `
    <div class="panel">
      <h2>Issue Types on open tickets</h2>
      <div class="check-list">${issueRows}</div>
    </div>` : ""}
    ${c && c.sampleRaw ? `
    <div class="panel">
      <h2>Sample ticket (raw from RepairShopr) <button class="btn ghost small" onclick="copyRaw()">Copy</button></h2>
      <div class="meter-note" style="margin-bottom:6px">If anything looks off, copy this and paste it to Claude.</div>
      <pre class="raw-json" id="rs-raw">${esc(JSON.stringify(c.sampleRaw, null, 2))}</pre>
    </div>` : ""}
  `;
}

/* ----- Book Time Database ----- */
function renderBookTimeHome() {
  const keys = [...CATEGORY_ORDER.filter(k => state.bookTimeCategories[k]), ...Object.keys(state.bookTimeCategories).filter(k => !CATEGORY_ORDER.includes(k))];
  const categoryCards = keys.map(key => [key, state.bookTimeCategories[key]]).map(([key, cat]) => `
    <button class="booktime-category-btn" onclick="openBookTimeCategory(${jsArg(key)})">
      <span class="booktime-category-label">${esc(cat.label)}</span>
      <span class="booktime-category-count">${Object.keys(cat.subtypes).length} sub-types &rarr;</span>
    </button>
  `).join("");
  return `
    <div class="panel">
      ${backCrumb()}
      <h2>Book Time Database</h2>
      <div class="meter-note" style="margin-bottom:10px;">Standard repair times by device type — click into a category to view/edit the grid.</div>
      <div class="booktime-entry-grid">${categoryCards}</div>
      <div style="margin-top:14px; padding-top:12px; border-top:1px solid var(--grid); font-size:12.5px; color:var(--text-secondary);">
        Logged time within
        <input id="threshold-input" class="booktime-input" style="width:48px" type="number" min="0" value="${esc(state.overBookThresholdPct)}" onchange="setThreshold(this.value)">
        % over book time shows yellow &mdash; beyond that, red.
      </div>
    </div>
  `;
}
function renderBookTimeGridTable(catKey, subKey, sub) {
  const a = `${jsArg(catKey)}, ${jsArg(subKey)}`;
  const headerCells = sub.columns.map((c, ci) => `<th>${esc(c)} <button class="bt-del" title="Remove repair type “${esc(c)}”" onclick="editBookTimeStructure(${a}, 'delCol', ${ci})">✕</button></th>`).join("");
  const rowKey = `${catKey}|${subKey}|row`, colKey = `${catKey}|${subKey}|col`;
  const bodyRows = sub.rows.map((rowLabel, ri) => `
    <tr>
      <td class="booktime-row-label">${esc(rowLabel)} <button class="bt-del" title="Remove model “${esc(rowLabel)}”" onclick="editBookTimeStructure(${a}, 'delRow', ${ri})">✕</button></td>
      ${sub.columns.map((c, ci) => `
        <td><input id="bt-${esc(catKey)}-${esc(subKey)}-${ri}-${ci}" class="booktime-input" type="number" min="0" value="${esc(sub.data[rowLabel][c] ?? '')}" placeholder="N/A" onchange="setBookTimeCell(${jsArg(catKey)}, ${jsArg(subKey)}, ${ri}, ${ci}, this.value)"></td>
      `).join("")}
    </tr>
  `).join("");
  return `
    <table class="booktime-grid">
      <thead><tr><th></th>${headerCells}</tr></thead>
      <tbody>${bodyRows}</tbody>
    </table>
    <div class="bt-struct">
      <input id="bt-add-${esc(catKey)}-${esc(subKey)}-row" data-draft="1" class="admin-input" placeholder="New model" value="${esc(state.structDrafts[rowKey] || "")}" oninput="state.structDrafts[${jsArg(rowKey)}] = this.value">
      <button class="btn small" onclick="editBookTimeStructure(${a}, 'addRow')">+ Add model</button>
      <input id="bt-add-${esc(catKey)}-${esc(subKey)}-col" data-draft="1" class="admin-input" placeholder="New repair type" value="${esc(state.structDrafts[colKey] || "")}" oninput="state.structDrafts[${jsArg(colKey)}] = this.value" style="margin-left:10px">
      <button class="btn small" onclick="editBookTimeStructure(${a}, 'addCol')">+ Add repair type</button>
    </div>
  `;
}
async function editBookTimeStructure(catKey, subKey, op, index) {
  const sub = state.bookTimeCategories[catKey].subtypes[subKey];
  const draftKey = `${catKey}|${subKey}|${op === "addRow" ? "row" : "col"}`;
  let name = null;
  if (op === "addRow" || op === "addCol") {
    name = (state.structDrafts[draftKey] || "").trim();
    if (!name) { showToast(`Type a ${op === "addRow" ? "model" : "repair type"} name first`, "error"); return; }
  } else {
    const label = op === "delRow" ? sub.rows[index] : sub.columns[index];
    if (!confirm(`Remove “${label}” and all its minutes from ${sub.label}?`)) return;
  }
  const r = await mutate("/admin/booktime-structure", { cat: catKey, sub: subKey, op, name, index });
  if (r && name) { state.structDrafts[draftKey] = ""; render(); }
}
// Every category's sub-types stacked on one scrolling page.
function renderBookTimeCategory() {
  const catKey = state.adminCategory;
  const cat = state.bookTimeCategories[catKey];
  const order = (STACK_ORDER_BY_CATEGORY[catKey] || Object.keys(cat.subtypes)).filter(k => cat.subtypes[k]);
  const sections = order.map(subKey => {
    const sub = cat.subtypes[subKey];
    return `
      <div class="booktime-stacked-section">
        <h3 class="booktime-stacked-heading">${esc(sub.label)}</h3>
        ${renderBookTimeGridTable(catKey, subKey, sub)}
      </div>
    `;
  }).join("");
  const moduleNames = order.map(subKey => cat.subtypes[subKey].label).join(", ");
  return `
    <div class="panel" style="overflow-x:auto;">
      <div class="breadcrumb"><button class="btn ghost small" onclick="backToBookTimeHome()">&larr; Book Time Database</button></div>
      <h2>${esc(cat.label)}</h2>
      <div class="meter-note" style="margin-bottom:6px;">All sub-types on one page &mdash; scroll to see ${esc(moduleNames)}. Minutes; leave a cell blank for N/A. Saves when you leave the cell.</div>
      ${sections}
    </div>
  `;
}
function openAdminSection(key) {
  state.adminSection = key;
  state.adminView = "home"; state.adminCategory = null;
  navigate();
}
function openBookTimeCategory(key) { state.adminCategory = key; state.adminView = "category"; navigate(); }
function backToAdminHome() { state.adminSection = null; state.adminView = "home"; state.adminCategory = null; navigate(); }
function backToBookTimeHome() { state.adminView = "home"; state.adminCategory = null; navigate(); }
function setBookTimeCell(catKey, subKey, rowIdx, colIdx, val) {
  const sub = state.bookTimeCategories[catKey].subtypes[subKey];
  const trimmed = (val ?? "").toString().trim();
  const value = trimmed === "" ? null : Math.max(0, Math.round(Number(trimmed) || 0)); // empty = N/A
  mutate("/admin/booktime-cell", { cat: catKey, sub: subKey, rowIdx, colIdx, value: trimmed }, () => {
    sub.data[sub.rows[rowIdx]][sub.columns[colIdx]] = value;
  });
}
function setThreshold(val) {
  const v = Math.max(0, Number(val) || 0);
  mutate("/admin/threshold", { value: v }, () => { state.overBookThresholdPct = v; });
}

/* ---------- Settings (all users) ---------- */
function renderSettings() {
  return `
    <div class="panel">
      <h2>Settings</h2>
      <div class="setting-row">
        <div>
          <div class="setting-label">Appearance</div>
          <div class="meter-note">Your pick is remembered on this device.</div>
        </div>
        <div class="theme-toggle">
          ${THEMES.map(t => `<button class="theme-toggle-btn ${state.theme === t.key ? 'active' : ''}" onclick="setTheme('${t.key}')">${t.label}</button>`).join("")}
        </div>
      </div>
      <div class="setting-row" style="border-top:1px solid var(--grid); margin-top:10px; padding-top:14px; align-items:flex-start">
        <div>
          <div class="setting-label">My Day order</div>
          <div class="meter-note">How "Your assigned tickets" is sorted — just for you.</div>
        </div>
        <div class="sort-options">
          ${SORT_MODES.map(m => `<label class="sort-option"><input type="radio" name="sortmode" ${state.sortMode === m.key ? "checked" : ""} onchange="setSortMode('${m.key}')"> ${esc(m.label)}</label>`).join("")}
        </div>
      </div>
    </div>
  `;
}
function setTheme(mode) {
  state.theme = mode;
  store.set("lr_theme", mode);
  document.documentElement.setAttribute('data-theme', mode);
  render();
}

/* ---------- boot ---------- */
document.documentElement.setAttribute('data-theme', state.theme);
render();
(async () => {
  if (!state.token) { state.screen = "login"; render(); return; }
  try { await enterApp(); }
  catch (e) {
    if (state.screen !== "login") { state.screen = "login"; state.loginError = e.message; render(); }
  }
})();
</script>
</body>
