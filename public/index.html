    return `<label><input type="checkbox" ${state.diagnosisEligibleStatuses.includes(s) ? "checked" : ""} onchange="toggleEligibleStatus(${jsArg(s)})"> ${esc(s)} <span class="count">${seen ? `${seen.count} ticket${seen.count === 1 ? "" : "s"}` : "not seen in current tickets"}</span></label>`;
  }).join("");
  const issueRows = c && c.issueTypes ? c.issueTypes.map(it => `
    <label>${ISSUE_TYPE_TO_DEVICE[it.value] ? `<span class="ok-text">✓</span>` : `<span class="bad-text">–</span>`} ${esc(it.value)} <span class="count">${it.count} · ${ISSUE_TYPE_TO_DEVICE[it.value] ? `→ ${esc(ISSUE_TYPE_TO_DEVICE[it.value].category)} / ${esc(ISSUE_TYPE_TO_DEVICE[it.value].subtype)}` : "no book-time mapping (tech sets it by hand)"}</span></label>`).join("") : "";
  return `
    <div class="panel">
      ${backCrumb()}
      <h2>RepairShopr connection</h2>
      <div style="margin-bottom:12px"><button class="btn primary small" onclick="runRsCheck()" ${state.rsCheckLoading ? "disabled" : ""}>${state.rsCheckLoading ? "Checking…" : "Run check"}</button></div>
      ${c ? `
        <div style="margin-bottom:10px; font-size:13px">${c.ok ? `<span class="ok-text">✓ Connected</span> — ${c.ticketCount} open/resolved-today tickets pulled${c.openMeta ? ` (RS says ${esc(c.openMeta.total_entries)} open across ${esc(c.openMeta.total_pages)} pages)` : ""}, ${c.users ? c.users.length : 0} RS users.` : `<span class="bad-text">✗ Problem</span>`}</div>
        ${c.errors && c.errors.length ? `<div class="rs-warning">${c.errors.map(esc).join("<br>")}</div>` : ""}
      ` : `<div class="meter-note">Pulls tickets + users from RepairShopr right now and shows what came back.</div>`}
    </div>
    <div class="panel">
      <h2>Diagnosis-credit statuses</h2>
      <div class="meter-note">Tickets sitting in a checked status (and that the tech worked on today) show up under "Diagnosis credit available". ${c ? "" : "Run the check above to list every status your open tickets are actually in."}</div>
      <div class="check-list">${statusChecks || `<span class="meter-note">None set.</span>`}</div>
    </div>
    ${c && c.issueTypes ? `
    <div class="panel">
      <h2>Issue Types on open tickets</h2>
      <div class="check-list">${issueRows}</div>
    </div>` : ""}
    ${c && c.sampleRaw ? `
    <div class="panel">
      <h2>Sample ticket (raw from RepairShopr) <button class="btn ghost small" onclick="copyRaw()">Copy</button></h2>
      <div class="meter-note" style="margin-bottom:6px">If anything looks off, copy this and paste it to Claude.</div>
      <pre class="raw-json" id="rs-raw">${esc(JSON.stringify(c.sampleRaw, null, 2))}</pre>
    </div>` : ""}
  `;
}

/* ----- Book Time Database ----- */
function renderBookTimeHome() {
  const categoryCards = Object.entries(state.bookTimeCategories).map(([key, cat]) => `
    <button class="booktime-category-btn" onclick="openBookTimeCategory(${jsArg(key)})">
      <span class="booktime-category-label">${esc(cat.label)}</span>
      <span class="booktime-category-count">${Object.keys(cat.subtypes).length} sub-types &rarr;</span>
    </button>
  `).join("");
  return `
    <div class="panel">
      ${backCrumb()}
      <h2>Book Time Database</h2>
      <div class="meter-note" style="margin-bottom:10px;">Standard repair times by device type — click into a category to view/edit the grid.</div>
      <div class="booktime-entry-grid">${categoryCards}</div>
      <div style="margin-top:14px; padding-top:12px; border-top:1px solid var(--grid); font-size:12.5px; color:var(--text-secondary);">
        Logged time within
        <input id="threshold-input" class="booktime-input" style="width:48px" type="number" min="0" value="${esc(state.overBookThresholdPct)}" onchange="setThreshold(this.value)">
        % over book time shows yellow &mdash; beyond that, red.
      </div>
    </div>
  `;
}
function renderBookTimeGridTable(catKey, subKey, sub) {
  const headerCells = sub.columns.map(c => `<th>${esc(c)}</th>`).join("");
  const bodyRows = sub.rows.map((rowLabel, ri) => `
    <tr>
      <td class="booktime-row-label">${esc(rowLabel)}</td>
      ${sub.columns.map((c, ci) => `
        <td><input id="bt-${esc(catKey)}-${esc(subKey)}-${ri}-${ci}" class="booktime-input" type="number" min="0" value="${esc(sub.data[rowLabel][c] ?? '')}" placeholder="N/A" onchange="setBookTimeCell(${jsArg(catKey)}, ${jsArg(subKey)}, ${ri}, ${ci}, this.value)"></td>
      `).join("")}
    </tr>
  `).join("");
  return `
    <table class="booktime-grid">
      <thead><tr><th></th>${headerCells}</tr></thead>
      <tbody>${bodyRows}</tbody>
    </table>
  `;
}
// Every category's sub-types stacked on one scrolling page.
function renderBookTimeCategory() {
  const catKey = state.adminCategory;
  const cat = state.bookTimeCategories[catKey];
  const order = (STACK_ORDER_BY_CATEGORY[catKey] || Object.keys(cat.subtypes)).filter(k => cat.subtypes[k]);
  const sections = order.map(subKey => {
    const sub = cat.subtypes[subKey];
    return `
      <div class="booktime-stacked-section">
        <h3 class="booktime-stacked-heading">${esc(sub.label)}</h3>
        ${renderBookTimeGridTable(catKey, subKey, sub)}
      </div>
    `;
  }).join("");
  const moduleNames = order.map(subKey => cat.subtypes[subKey].label).join(", ");
  return `
    <div class="panel" style="overflow-x:auto;">
      <div class="breadcrumb"><button class="btn ghost small" onclick="backToBookTimeHome()">&larr; Book Time Database</button></div>
      <h2>${esc(cat.label)}</h2>
      <div class="meter-note" style="margin-bottom:6px;">All sub-types on one page &mdash; scroll to see ${esc(moduleNames)}. Minutes; leave a cell blank for N/A. Saves when you leave the cell.</div>
      ${sections}
    </div>
  `;
}
function openAdminSection(key) {
  state.adminSection = key;
  state.adminView = "home"; state.adminCategory = null;
  navigate();
}
function openBookTimeCategory(key) { state.adminCategory = key; state.adminView = "category"; navigate(); }
function backToAdminHome() { state.adminSection = null; state.adminView = "home"; state.adminCategory = null; navigate(); }
function backToBookTimeHome() { state.adminView = "home"; state.adminCategory = null; navigate(); }
function setBookTimeCell(catKey, subKey, rowIdx, colIdx, val) {
  const sub = state.bookTimeCategories[catKey].subtypes[subKey];
  const trimmed = (val ?? "").toString().trim();
  const value = trimmed === "" ? null : Math.max(0, Math.round(Number(trimmed) || 0)); // empty = N/A
  mutate("/admin/booktime-cell", { cat: catKey, sub: subKey, rowIdx, colIdx, value: trimmed }, () => {
    sub.data[sub.rows[rowIdx]][sub.columns[colIdx]] = value;
  });
}
function setThreshold(val) {
  const v = Math.max(0, Number(val) || 0);
  mutate("/admin/threshold", { value: v }, () => { state.overBookThresholdPct = v; });
}

/* ---------- Settings (all users) ---------- */
function renderSettings() {
  return `
    <div class="panel">
      <h2>Settings</h2>
      <div class="setting-row">
        <div>
          <div class="setting-label">Appearance</div>
          <div class="meter-note">Light/dark — applies to this device only.</div>
        </div>
        <div class="theme-toggle">
          <button class="theme-toggle-btn ${state.theme==='light'?'active':''}" onclick="setTheme('light')">☀ Light</button>
          <button class="theme-toggle-btn ${state.theme==='dark'?'active':''}" onclick="setTheme('dark')">🌙 Dark</button>
        </div>
      </div>
    </div>
  `;
}
function setTheme(mode) {
  state.theme = mode;
  store.set("lr_theme", mode);
  document.documentElement.setAttribute('data-theme', mode);
  render();
}

/* ---------- boot ---------- */
document.documentElement.setAttribute('data-theme', state.theme);
render();
(async () => {
  if (!state.token) { state.screen = "login"; render(); return; }
  try { await enterApp(); }
  catch (e) {
    if (state.screen !== "login") { state.screen = "login"; state.loginError = e.message; render(); }
  }
})();
</script>
</body>
</html>
