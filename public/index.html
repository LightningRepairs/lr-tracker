<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lightning Repairs — Tech Tool</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Crect width=%2724%27 height=%2724%27 rx=%275%27 fill=%27%231596d1%27/%3E%3Cpath d=%27M13 2 3 14h7l-1 8 11-14h-7l0-6z%27 fill=%27%23ffcc00%27/%3E%3C/svg%3E">
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7;
    --surface: #fcfcfb;
    --surface-2: #f3f2ee;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #898781;
    --grid: #e1e0d9;
    --baseline: #c3c2b7;
    --border: rgba(11,11,11,0.10);

    --brand-navy: #0b1e3d;
    --brand-navy-2: #142c54;
    --brand-blue: #1596d1; /* the bright sky-blue from the Lightning Repairs logo background */
    --brand-gold: #ffcc00; /* the logo's lightning-bolt yellow */

    --s1: #2a78d6; /* Drew */
    --s2: #eb6834; /* Aaron */
    --s3: #1baf7a; /* Chase */
    --s4: #eda100; /* Zach */
    --s5: #e87ba4; /* Nathan */

    --good: #0ca30c;
    --good-text: #006300;
    --warning: #fab219;
    --serious: #ec835a;
    --critical: #d03b3b;
  }
  /* Dark mode — status colors (good/warning/serious/critical) are fixed and never themed;
     only surfaces, text, borders and the per-person series colors flip. */
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --surface-2: #242422;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted: #898781;
    --grid: #2c2c2a;
    --baseline: #383835;
    --border: rgba(255,255,255,0.10);

    --s1: #3987e5; /* Drew */
    --s2: #d95926; /* Aaron */
    --s3: #199e70; /* Chase */
    --s4: #c98500; /* Zach */
    --s5: #d55181; /* Nathan */

    --good-text: #0ca30c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  #app { min-height: 100vh; display: flex; flex-direction: column; }

  /* ---------- shared bits ---------- */
  .brand-row { display: flex; align-items: center; gap: 10px; }
  .bolt { width: 24px; height: 24px; flex: none; color: var(--brand-gold); }
  button { font-family: inherit; cursor: pointer; }

  .btn {
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-primary);
    padding: 9px 14px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
  }
  .btn:hover { background: var(--surface-2); }
  .btn.primary { background: var(--brand-blue); border-color: var(--brand-blue); color: #fff; }
  .btn.primary:hover { background: color-mix(in srgb, var(--brand-blue) 82%, black); }
  .btn.ghost { background: transparent; border-color: transparent; color: var(--text-secondary); }
  .btn.small { padding: 6px 10px; font-size: 12px; }
  .btn.danger-outline { border-color: color-mix(in srgb, var(--critical) 50%, transparent); color: var(--critical); background: transparent; }

  /* ---------- LOGIN ---------- */
  .login-screen {
    flex: 1; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(160deg, var(--brand-blue), var(--brand-navy));
  }
  .login-card {
    background: var(--surface);
    border-radius: 16px;
    padding: 32px 30px 26px;
    width: 320px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
  }
  .login-card .brand-row { justify-content: center; margin-bottom: 4px; }
  .login-card h1 { font-size: 15px; margin: 2px 0 18px; color: var(--text-secondary); font-weight: 600; }
  .pin-dots { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; }
  .pin-dot { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--baseline); }
  .pin-dot.filled { background: var(--brand-blue); border-color: var(--brand-blue); }
  .pin-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .pin-key {
    aspect-ratio: 1; border-radius: 50%; border: 1px solid var(--border);
    background: var(--surface-2); font-size: 18px; font-weight: 600; color: var(--text-primary);
  }
  .pin-key:hover { background: var(--grid); }
  .pin-key.func { font-size: 12px; color: var(--text-muted); background: transparent; border-color: transparent; }
  .login-error { color: var(--critical); font-size: 12px; margin-top: 12px; min-height: 16px; }
  .login-hint { color: var(--text-muted); font-size: 11px; margin-top: 16px; line-height: 1.5; }

  /* ---------- POSITION PICKER ---------- */
  .position-screen {
    flex: 1; display: flex; align-items: center; justify-content: center;
    background: var(--page);
  }
  .position-card { text-align: center; width: 380px; }
  .position-card h1 { font-size: 20px; margin-bottom: 2px; }
  .position-card .sub { color: var(--text-secondary); font-size: 13.5px; margin-bottom: 22px; }
  .position-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .position-btn {
    padding: 22px 10px; border-radius: 12px; border: 1.5px solid var(--border);
    background: var(--surface); font-size: 14.5px; font-weight: 700; color: var(--text-primary);
  }
  .position-btn:hover { border-color: var(--brand-blue); background: color-mix(in srgb, var(--brand-blue) 6%, var(--surface)); }
  .position-btn .goal { display: block; font-size: 11.5px; font-weight: 400; color: var(--text-muted); margin-top: 4px; }

  /* ---------- APP SHELL ---------- */
  .topbar {
    background: linear-gradient(135deg, var(--brand-blue), var(--brand-navy));
    color: #fff; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; height: 56px;
  }
  .topbar .tabs { display: flex; gap: 4px; height: 100%; }
  .topbar .tab {
    background: transparent; border: none; color: #c9d3e4; font-size: 13px; font-weight: 600;
    padding: 0 14px; height: 100%; border-bottom: 3px solid transparent;
  }
  .topbar .tab.active { color: #fff; border-bottom-color: var(--brand-gold); }
  .topbar .tab:hover { color: #fff; }
  .who { display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: #e8ecf3; }
  .who .avatar { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #fff; }
  .who .pos-badge { background: rgba(255,255,255,0.12); padding: 2px 8px; border-radius: 999px; font-size: 11px; border: none; color: #e8ecf3; font-family: inherit; }
  .who .pos-badge.clickable { cursor: pointer; }
  .who .pos-badge.clickable:hover { background: rgba(255,255,255,0.2); }
  .pos-switcher { position: relative; }
  .pos-menu {
    position: absolute; top: calc(100% + 6px); left: 0; z-index: 20;
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2); min-width: 140px; overflow: hidden;
  }
  .pos-menu-item {
    display: block; width: 100%; text-align: left; padding: 9px 12px; border: none; background: transparent;
    font-size: 12.5px; color: var(--text-primary); border-bottom: 1px solid var(--grid);
  }
  .pos-menu-item:last-child { border-bottom: none; }
  .pos-menu-item:hover { background: var(--surface-2); }
  .pos-menu-item.current { font-weight: 700; color: var(--brand-blue); }

  main.content { flex: 1; max-width: 1100px; width: 100%; margin: 0 auto; padding: 22px 24px 40px; }

  .proto-banner {
    background: color-mix(in srgb, var(--warning) 18%, var(--surface));
    border: 1px solid color-mix(in srgb, var(--warning) 45%, transparent);
    font-size: 12.5px; padding: 9px 13px; border-radius: 8px; margin-bottom: 18px;
  }

  /* ---------- GOAL METERS ---------- */
  .meters-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 20px; }
  .meter-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; }
  .meter-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .meter-title { font-size: 12.5px; color: var(--text-secondary); font-weight: 600; }
  .meter-value { font-size: 20px; font-weight: 700; }
  .meter-value .of { font-size: 13px; color: var(--text-muted); font-weight: 400; }
  .meter-track { position: relative; height: 10px; background: var(--grid); border-radius: 6px; overflow: visible; margin-bottom: 8px; }
  .meter-fill { position: absolute; top: 0; left: 0; height: 100%; border-radius: 6px; background: var(--brand-blue); }
  .meter-pace { position: absolute; top: -3px; width: 2px; height: 16px; background: var(--text-muted); border-radius: 1px; }
  .status-chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; }
  .status-chip.good { background: color-mix(in srgb, var(--good) 16%, transparent); color: var(--good-text); }
  .status-chip.serious { background: color-mix(in srgb, var(--serious) 20%, transparent); color: color-mix(in srgb, var(--serious) 70%, black); }
  .meter-note { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

  /* ---------- TICKET LIST ---------- */
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; margin-bottom: 16px; }
  .panel h2 { font-size: 13.5px; font-weight: 600; margin: 0 0 12px 0; }
  .ticket-row {
    display: flex; align-items: center; gap: 12px; padding: 12px 4px; border-bottom: 1px solid var(--grid);
  }
  .ticket-row:last-child { border-bottom: none; }
  .ticket-main { flex: 1; min-width: 0; }
  a.ticket-main { display: block; text-decoration: none; color: inherit; border-radius: 6px; margin: -4px; padding: 4px; }
  a.ticket-main:hover { background: var(--surface-2); }
  a.ticket-main:hover .ticket-subject { text-decoration: underline; }
  .ticket-num { font-size: 12px; color: var(--text-muted); }
  .ticket-num .rs-link-icon { color: var(--brand-blue); }
  .ticket-subject { font-size: 13.5px; font-weight: 600; }
  .ticket-status { font-size: 11px; padding: 2px 8px; border-radius: 999px; font-weight: 600; }
  .ticket-status.new { background: color-mix(in srgb, var(--text-muted) 20%, transparent); color: var(--text-secondary); }
  .ticket-status.progress { background: color-mix(in srgb, var(--warning) 22%, transparent); color: color-mix(in srgb, var(--warning) 65%, black); }
  .ticket-status.needs_called { background: color-mix(in srgb, var(--warning) 22%, transparent); color: color-mix(in srgb, var(--warning) 65%, black); }
  .ticket-status.awaiting_client, .ticket-status.awaiting_parts { background: color-mix(in srgb, var(--text-muted) 20%, transparent); color: var(--text-secondary); }
  .ticket-status.backburner { background: color-mix(in srgb, var(--serious) 18%, transparent); color: color-mix(in srgb, var(--serious) 70%, black); }
  .diag-badge { font-size: 10.5px; color: var(--text-muted); background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px; padding: 2px 8px; white-space: nowrap; }
  .diag-row { flex-wrap: wrap; row-gap: 8px; }
  .diag-actions { display: flex; gap: 6px; flex-wrap: wrap; width: 100%; justify-content: flex-end; }
  .work-outcome-badge { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; white-space: nowrap; border: none; font-family: inherit; }
  .work-outcome-badge.diagnosis_completed, .work-outcome-badge.repair_completed { background: color-mix(in srgb, var(--good) 16%, transparent); color: var(--good-text); }
  .work-outcome-badge.diagnosis_incomplete, .work-outcome-badge.repair_incomplete { background: color-mix(in srgb, var(--text-muted) 20%, transparent); color: var(--text-secondary); }
  .work-outcome-badge.clickable { cursor: pointer; }
  .work-outcome-badge.clickable:hover { filter: brightness(0.93); }
  .timer-controls { display: flex; align-items: center; gap: 8px; }
  .timer-display { font-variant-numeric: tabular-nums; font-size: 13px; font-weight: 700; min-width: 58px; text-align: right; padding: 2px 7px; border-radius: 6px; }
  .timer-display.running { color: var(--good-text); }
  .timer-display.paused { color: var(--text-secondary); }
  .timer-display.logged-good { background: color-mix(in srgb, var(--good) 18%, transparent); color: var(--good-text); }
  .timer-display.logged-warning { background: color-mix(in srgb, var(--warning) 28%, transparent); color: color-mix(in srgb, var(--warning) 55%, black); }
  .timer-display.logged-critical { background: color-mix(in srgb, var(--critical) 20%, transparent); color: var(--critical); }
  .icon-btn {
    width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface-2);
    display: flex; align-items: center; justify-content: center; font-size: 12px;
  }
  .icon-btn:hover { background: var(--grid); }
  .icon-btn.play { color: var(--good-text); }
  .icon-btn.stop { color: var(--critical); }
  .note-box { margin-top: 8px; display: flex; gap: 8px; align-items: flex-start; }
  .note-box textarea { flex: 1; border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; font-size: 12.5px; font-family: inherit; resize: none; }
  .note-box input[type="number"] { width: 120px; border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; font-size: 12.5px; font-family: inherit; }
  .note-saved { font-size: 11px; color: var(--good-text); margin-top: 4px; display: none; }
  .manual-hint { font-size: 11px; color: var(--warning); margin-top: 4px; }
  .manual-confirm { font-size: 11px; color: var(--good-text); margin-top: 4px; }
  .ticket-actions { display: flex; gap: 6px; }

  /* ---------- TEAM TAB ---------- */
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-muted); font-weight: 600; padding: 0 10px 8px; border-bottom: 1px solid var(--grid); }
  tbody td { padding: 10px; border-bottom: 1px solid var(--grid); vertical-align: middle; }
  tbody tr:last-child td { border-bottom: none; }
  .person-cell { display: flex; align-items: center; gap: 8px; }
  .avatar { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #fff; flex: none; }
  .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--good); display: inline-block; margin-right: 5px; animation: pulse 1.4s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
  .mini-meter-track { height: 6px; width: 110px; background: var(--grid); border-radius: 4px; position: relative; display: inline-block; vertical-align: middle; margin-right: 6px; }
  .mini-meter-fill { position: absolute; left: 0; top: 0; height: 100%; border-radius: 4px; background: var(--brand-blue); }

  /* ---------- QUEUE GROUPS ---------- */
  .queue-group { border: 1px solid var(--border); border-radius: 8px; margin-bottom: 10px; overflow: hidden; }
  .queue-group:last-child { margin-bottom: 0; }
  .queue-group-header {
    width: 100%; display: flex; align-items: center; gap: 4px; padding: 10px 12px;
    background: var(--surface-2); border: none; text-align: left; font-size: 13px;
  }
  .queue-group-header:hover { background: var(--grid); }
  .queue-caret { font-size: 9px; color: var(--text-muted); width: 12px; }
  .queue-group-label { font-weight: 700; flex: 1; }
  .queue-group-count { font-size: 11.5px; color: var(--text-muted); background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 1px 8px; }
  .queue-group-body { padding: 2px 12px; }
  .queue-group-body .ticket-row { padding: 10px 4px; gap: 10px; }
  .assign-select-wrap { display: flex; align-items: center; gap: 6px; }
  .assign-select-label { font-size: 11.5px; color: var(--text-muted); }
  .assign-select {
    border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px; font-size: 12.5px;
    background: var(--surface); color: var(--text-primary); font-family: inherit;
  }
  .outcome-select {
    border: 1px solid var(--border); border-radius: 6px; padding: 6px 9px; font-size: 12.5px;
    background: var(--surface); color: var(--text-primary); font-family: inherit; min-width: 220px;
  }
  .device-picker { width: 100%; display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }
  .device-picker-row { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .device-select {
    border: 1px solid var(--border); border-radius: 6px; padding: 5px 7px; font-size: 12px;
    background: var(--surface); color: var(--text-primary); font-family: inherit;
  }
  .device-picker-note { font-size: 11px; color: var(--text-muted); text-align: right; }
  .device-inline-row { padding: 0 4px 10px; }
  .device-chip {
    font-size: 11.5px; font-weight: 600; color: var(--text-secondary); background: var(--surface-2);
    border: 1px solid var(--border); border-radius: 999px; padding: 5px 10px; white-space: nowrap; font-family: inherit;
  }
  .device-chip.clickable { cursor: pointer; }
  .device-chip.clickable:hover { border-color: var(--brand-blue); }

  /* ---------- ADMIN ---------- */
  .admin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .role-check { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; padding: 4px 9px; border-radius: 999px; border: 1px solid var(--border); margin-right: 6px; background: var(--surface-2); }
  .role-check input { accent-color: var(--brand-blue); }
  .booktime-input { width: 64px; border: 1px solid var(--border); border-radius: 6px; padding: 5px 7px; font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .booktime-entry-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
  .booktime-category-btn {
    display: flex; flex-direction: column; align-items: flex-start; gap: 4px;
    padding: 16px 14px; border-radius: 10px; border: 1.5px solid var(--border);
    background: var(--surface); text-align: left;
  }
  .booktime-category-btn:hover { border-color: var(--brand-blue); background: color-mix(in srgb, var(--brand-blue) 6%, var(--surface)); }
  .booktime-category-label { font-size: 13px; font-weight: 700; line-height: 1.3; }
  .booktime-category-count { font-size: 11px; color: var(--text-muted); }
  .breadcrumb { margin-bottom: 10px; }
  .booktime-grid { width: max-content; min-width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .booktime-grid th, .booktime-grid td { padding: 6px 8px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
  .booktime-grid thead th { font-size: 10px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-muted); text-align: center; font-weight: 600; }
  .booktime-row-label { font-weight: 700; position: sticky; left: 0; background: var(--surface); }
  .booktime-grid .booktime-input { width: 54px; }
  .booktime-stacked-section { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--grid); }
  .booktime-stacked-section:first-of-type { margin-top: 10px; padding-top: 0; border-top: none; }
  .booktime-stacked-heading { font-size: 13.5px; font-weight: 700; margin: 0 0 8px; }

  .admin-menu { display: flex; flex-direction: column; gap: 8px; }
  .admin-menu-item {
    display: flex; align-items: center; gap: 14px; width: 100%; text-align: left;
    padding: 14px 16px; border-radius: 10px; border: 1.5px solid var(--border); background: var(--surface);
  }
  .admin-menu-item:hover { border-color: var(--brand-blue); background: color-mix(in srgb, var(--brand-blue) 6%, var(--surface)); }
  .admin-menu-icon { font-size: 20px; flex: none; }
  .admin-menu-text { flex: 1; display: flex; flex-direction: column; gap: 2px; }
  .admin-menu-label { font-size: 14px; font-weight: 700; }
  .admin-menu-desc { font-size: 12px; color: var(--text-muted); }
  .admin-menu-chevron { font-size: 20px; color: var(--text-muted); flex: none; }

  /* ---------- SETTINGS ---------- */
  .setting-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 6px 4px; }
  .setting-label { font-size: 13.5px; font-weight: 700; margin-bottom: 2px; }
  .theme-toggle { display: flex; gap: 6px; flex: none; }
  .theme-toggle-btn { border: 1.5px solid var(--border); background: var(--surface-2); color: var(--text-secondary); padding: 8px 14px; border-radius: 8px; font-size: 12.5px; font-weight: 600; }
  .theme-toggle-btn.active { border-color: var(--brand-blue); background: color-mix(in srgb, var(--brand-blue) 14%, var(--surface)); color: var(--text-primary); }

  @media (max-width: 760px) {
    .meters-row, .admin-grid { grid-template-columns: 1fr; }
  }

  /* ---------- real-app additions ---------- */
  .ticket-status.resolved { background: color-mix(in srgb, var(--good) 16%, transparent); color: var(--good-text); }
  .ticket-customer { font-size: 11.5px; color: var(--text-muted); }
  .loading-screen { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--text-muted); font-size: 14px; }
  .rs-warning {
    background: color-mix(in srgb, var(--critical) 12%, var(--surface));
    border: 1px solid color-mix(in srgb, var(--critical) 40%, transparent);
    font-size: 12.5px; padding: 9px 13px; border-radius: 8px; margin-bottom: 16px; word-break: break-word;
  }
  .toast {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 100;
    max-width: min(560px, calc(100vw - 32px)); padding: 10px 14px; border-radius: 8px; font-size: 13px;
    background: var(--brand-navy); color: #fff; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  }
  .toast.error { background: var(--critical); }
  .inline-outcome { display: flex; justify-content: flex-end; padding: 0 4px 10px; gap: 6px; flex-wrap: wrap; }
  .admin-input {
    border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px; font-size: 12.5px;
    background: var(--surface); color: var(--text-primary); font-family: inherit;
  }
  .pin-input { width: 70px; }
  .pin-state { font-size: 11px; color: var(--text-muted); margin-left: 4px; }
  .pin-state.ok { color: var(--good-text); }
  pre.raw-json {
    max-height: 360px; overflow: auto; background: var(--surface-2); padding: 10px; border-radius: 8px;
    font-size: 11.5px; white-space: pre-wrap; word-break: break-word; border: 1px solid var(--border);
  }
  .check-list { display: flex; flex-direction: column; gap: 4px; margin: 6px 0 12px; }
  .check-list label { font-size: 12.5px; display: flex; align-items: center; gap: 8px; }
  .check-list .count { color: var(--text-muted); font-size: 11.5px; }
  .ok-text { color: var(--good-text); font-weight: 600; }
  .bad-text { color: var(--critical); font-weight: 600; }
  @media (max-width: 760px) {
    .topbar { height: auto; flex-wrap: wrap; padding: 6px 12px; gap: 6px; }
    .topbar .tabs { height: 44px; overflow-x: auto; }
    main.content { padding: 16px 12px 40px; }
    .ticket-row { flex-wrap: wrap; }
    .who span:not(.pos-badge) { display: none; }
    .device-chip { white-space: normal; text-align: left; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast-root"></div>
<script>
/* ============ CONFIG ============ */
let RS_SUBDOMAIN = "lightningrepair"; // overwritten by the server's value on load
function rsTicketUrl(internalId) { return `https://${RS_SUBDOMAIN}.repairshopr.com/tickets/${internalId}`; }

const POSITIONS = ["Technician", "Float", "Sales", "Manager"];
const GOALS = { // seconds
  "Technician": { book: 6*3600, spent: 6*3600 },
  "Float":      { book: 4*3600, spent: 4*3600 },
  "Sales":      null,
  "Manager":    null,
};
const WORKDAY_START = 9, WORKDAY_END = 18; // 9a-6p, for the "on pace" tick
const POLL_MS = 30000;

const OUTCOME_LABELS = {
  diagnosis_completed: "Completed Diagnosis",
  repair_completed: "Completed Repair",
  diagnosis_incomplete: "Did Not Complete Diagnosis",
  repair_incomplete: "Did Not Complete Repair",
};

// RepairShopr "Issue Type" → Book Time Database category/subtype. Mirrors lib/booktime.mjs on the server.
const ISSUE_TYPE_TO_DEVICE = {
  "Phone": { category: "mobile", subtype: "phone" },
  "Tablet": { category: "mobile", subtype: "tablet" },
  "Smart Watch": { category: "mobile", subtype: "watch" },
  "Laptop": { category: "computer", subtype: "moduleLaptops" },
  "Desktop": { category: "computer", subtype: "desktop" },
  "All-in-One": { category: "computer", subtype: "allInOne" },
  "Game Console": { category: "gaming", subtype: "console" },
  "Game Controller": { category: "gaming", subtype: "controller" },
};
const STACK_ORDER_BY_CATEGORY = {
  mobile:   ["phone", "tablet", "watch"],
  computer: ["moduleLaptops", "desktop", "allInOne"],
  gaming:   ["handheld", "console", "controller"],
};

/* ============ small helpers ============ */
// Escape anything that came from RepairShopr / users before putting it in HTML.
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
// A string safely embedded as a JS argument inside an onclick="..." attribute.
function jsArg(s) { return esc(JSON.stringify(s == null ? null : String(s))); }
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} },
};
function nowMs() { return Date.now() + (state.clockOffset || 0); }
function firstName(personId) { const p = PEOPLE[personId]; return p ? p.name.split(" ")[0] : "Someone"; }

/* ============ STATE ============ */
let PEOPLE = {}; // id -> person (filled from the server)
let state = {
  screen: "loading",     // loading | login | position | app
  pin: "",
  loginError: "",
  loggingIn: false,
  token: store.get("lr_token"),
  me: null,
  currentUser: null,
  position: null,
  attendance: {},         // personId -> position they're working today (= who's "logged in today")
  tab: "day",             // day | team | admin | settings
  theme: store.get("lr_theme") || "light",
  today: null,
  clockOffset: 0,
  tickets: [],
  personToday: {},
  rsError: null,
  rsUsers: [],
  noteOpen: null,
  noteDrafts: {},
  manualOpen: null,
  manualDrafts: {},
  manualConfirm: {},
  deviceOverrideOpen: null, // ticket id currently showing the manual category/subtype override control
  outcomeEditOpen: null,    // ticket id currently showing its outcome dropdown in "Tickets I worked on today"
  bookTimeCategories: {},
  overBookThresholdPct: 15,
  diagnosisEligibleStatuses: [],
  adminSection: null,    // null (menu) | users | booktime | rs | reports
  adminView: "home",     // within the booktime section: home | category
  adminCategory: null,   // mobile | computer | gaming
  collapsedGroups: new Set(),
  positionMenuOpen: false,
  pinDrafts: {},
  newPersonName: "",
  rsCheck: null,
  rsCheckLoading: false,
};

/* ============ API ============ */
let lastMutationStartedAt = 0;
async function api(path, body) {
  const opts = { method: body === undefined ? "GET" : "POST", headers: {} };
  if (state.token) opts.headers.Authorization = "Bearer " + state.token;
  if (body !== undefined) { opts.headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(body); }
  // Never hang forever: give up after 20s with a clear message.
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 20000);
  opts.signal = ctrl.signal;
  let res;
  try { res = await fetch("/api" + path, opts); }
  catch (e) {
    throw new Error(e.name === "AbortError" ? "The server took too long to answer — try again in a minute" : "Can't reach the server — check your internet connection");
  } finally { clearTimeout(timer); }
  let data = null;
  try { data = await res.json(); } catch (e) {}
  if (res.status === 401 && path !== "/login") { logout(true); throw new Error("Session expired — log in again"); }
  if (!res.ok) throw new Error((data && data.error) || (res.status === 502 || res.status === 504
    ? "The server timed out — try again in a minute"
    : `Server error (${res.status})`));
  return data;
}

// Optimistic update → server call → reload real state. On failure, show why and reload (reverting).
async function mutate(path, body, optimistic) {
  lastMutationStartedAt = performance.now();
  if (optimistic) { optimistic(); render(); }
  try {
    const r = await api(path, body);
    await loadState();
    return r;
  } catch (e) {
    showToast(e.message, "error");
    loadState().catch(() => {});
    return null;
  }
}

let loading = null;
async function loadState() {
  const startedAt = performance.now();
  const p = api("/state");
  loading = p;
  const data = await p;
  if (startedAt < lastMutationStartedAt) return; // a newer change is in flight — its own reload will land
  applyServerState(data);
  if (safeToRerender()) render(); else pendingRender = true;
}

function applyServerState(d) {
  RS_SUBDOMAIN = d.rsSubdomain || RS_SUBDOMAIN;
  PEOPLE = Object.fromEntries(d.people.map(p => [p.id, { ...p, admin: p.isAdmin }]));
  state.me = d.me;
  state.currentUser = PEOPLE[d.me];
  state.attendance = Object.fromEntries(d.attendance.map(a => [a.personId, a.position]));
  state.today = d.today;
  state.clockOffset = d.serverNow - Date.now();
  state.bookTimeCategories = d.settings.bookTimes || {};
  state.overBookThresholdPct = d.settings.overBookThresholdPct;
  state.diagnosisEligibleStatuses = d.settings.diagnosisEligibleStatuses || [];
  state.personToday = d.personToday || {};
  state.rsError = d.rsError;
  state.rsUsers = d.rsUsers || [];
  state.tickets = d.tickets.map(buildTicket);
}

// Server ticket → the shape the UI works with (current user's timer folded in, device resolved).
function buildTicket(t) {
  const mine = (t.timers && t.timers[state.me]) || { state: "idle", runningSince: null, totalSec: 0, todaySec: 0 };
  const x = {
    ...t,
    timerState: mine.state,
    runningSince: mine.state === "running" ? mine.runningSince : null,
    spentSec: mine.totalSec || 0,
  };
  resolveDevice(x);
  recomputeBookedSec(x);
  return x;
}
// Category/Subtype: a manual override wins, otherwise RepairShopr's Issue Type decides (never asks).
function resolveDevice(t) {
  const mapped = t.issueType ? ISSUE_TYPE_TO_DEVICE[t.issueType] : null;
  if (t.deviceOverrideCategory) {
    t.deviceCategory = t.deviceOverrideCategory;
    t.deviceSubtype = t.deviceOverrideSubtype || null;
  } else {
    t.deviceCategory = mapped ? mapped.category : null;
    t.deviceSubtype = t.deviceOverrideSubtype || (mapped ? mapped.subtype : null);
  }
}

/* ============ book-time math (mirrors lib/booktime.mjs) ============ */
function deviceGridFor(t) {
  if (!t.deviceCategory || !t.deviceSubtype) return null;
  const cat = state.bookTimeCategories[t.deviceCategory];
  return (cat && cat.subtypes[t.deviceSubtype]) || null;
}
function diagnosticsMinutesFor(t) {
  const grid = deviceGridFor(t);
  if (!grid) return null;
  const row = (t.deviceRow && grid.data[t.deviceRow]) ? grid.data[t.deviceRow] : (grid.rows.length ? grid.data[grid.rows[0]] : null);
  return row ? (row["Diagnostics"] ?? null) : null;
}
function repairColumnsFor(t) {
  const grid = deviceGridFor(t);
  if (!grid || !t.deviceRow || !grid.data[t.deviceRow]) return [];
  return grid.columns.filter(c => c !== "Diagnostics" && grid.data[t.deviceRow][c] != null);
}
function repairMinutesFor(t, repairType) {
  const grid = deviceGridFor(t);
  if (!grid || !t.deviceRow || !repairType || !grid.data[t.deviceRow]) return null;
  return grid.data[t.deviceRow][repairType] ?? null;
}
function recomputeBookedSec(t) {
  const diagMin = diagnosticsMinutesFor(t) || 0;
  const repairMin = t.repairType ? (repairMinutesFor(t, t.repairType) || 0) : 0;
  t.bookedSec = (diagMin + repairMin) * 60;
}

/* ============ formatting ============ */
function fmtClock(sec) {
  sec = Math.max(0, sec);
  const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = Math.floor(sec%60);
  return [h,m,s].map((v,i) => i===0 && v===0 ? null : String(v).padStart(2,"0")).filter(Boolean).join(":") || "0:00";
}
function fmtHM(sec) {
  sec = Math.max(0, sec);
  const h = Math.floor(sec/3600), m = Math.round((sec%3600)/60);
  return h > 0 ? `${h}h ${m}m` : `${m}m`;
}
function liveSpentSec(t) {
  if (t.timerState === "running" && t.runningSince) return t.spentSec + (nowMs() - t.runningSince) / 1000;
  return t.spentSec;
}
function finalizeElapsed(t) {
  if (t.timerState === "running" && t.runningSince) t.spentSec += (nowMs() - t.runningSince) / 1000;
  t.runningSince = null;
}
function bookTimeVerdict(spentSec, bookedSec) {
  if (!bookedSec) return { tier: "good", icon: "✓", tooltip: "" };
  const thresholdSec = bookedSec * (1 + state.overBookThresholdPct / 100);
  const pct = Math.round(((spentSec - bookedSec) / bookedSec) * 100);
  if (spentSec <= bookedSec) {
    return { tier: "good", icon: "✓", tooltip: `${fmtHM(spentSec)} logged — ${fmtHM(bookedSec - spentSec)} under the ${fmtHM(bookedSec)} book-time standard` };
  }
  if (spentSec <= thresholdSec) {
    return { tier: "warning", icon: "⚠", tooltip: `${fmtHM(spentSec)} logged — ${pct}% over the ${fmtHM(bookedSec)} book-time standard (within the ${state.overBookThresholdPct}% warn range)` };
  }
  return { tier: "critical", icon: "⛔", tooltip: `${fmtHM(spentSec)} logged — ${pct}% over the ${fmtHM(bookedSec)} book-time standard` };
}
function statusClass(s) {
  const k = (s || "").toLowerCase();
  if (k === "new") return "new";
  if (k.includes("resolved") || k.includes("invoiced")) return "resolved";
  if (k.includes("progress")) return "progress";
  if (k.includes("call")) return "needs_called";
  if (k.includes("backburner")) return "backburner";
  if (k.includes("part")) return "awaiting_parts";
  if (k.includes("wait") || k.includes("customer") || k.includes("client") || k.includes("approval")) return "awaiting_client";
  return "new";
}
function statusPill(t) { return `<span class="ticket-status ${statusClass(t.status)}">${esc(t.status || "—")}</span>`; }
function ticketLink(t) {
  return `
    <a class="ticket-main" href="${rsTicketUrl(t.id)}" target="_blank" rel="noopener noreferrer" title="Open ticket #${esc(t.num)} in RepairShopr">
      <div class="ticket-num">#${esc(t.num ?? "")} <span class="rs-link-icon">↗</span>${t.customer ? ` <span class="ticket-customer">&middot; ${esc(t.customer)}</span>` : ""}</div>
      <div class="ticket-subject">${esc(t.subject)}</div>
    </a>`;
}

/* ============ toast ============ */
let toastTimer = null;
function showToast(msg, kind) {
  const root = document.getElementById("toast-root");
  root.innerHTML = `<div class="toast ${kind === "error" ? "error" : ""}">${esc(msg)}</div>`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { root.innerHTML = ""; }, kind === "error" ? 7000 : 3500);
}

/* ============ RENDER ============ */
// Inputs that keep their value in state (oninput → draft) carry data-draft="1" and survive re-renders.
// Any OTHER focused input (e.g. a Book Time cell mid-edit) or an open <select> blocks background re-renders.
let pendingRender = false;
function safeToRerender() {
  const a = document.activeElement;
  if (!a) return true;
  if (a.tagName === "SELECT") return false;
  if ((a.tagName === "INPUT" || a.tagName === "TEXTAREA") && a.dataset.draft !== "1") return false;
  return true;
}
function render() {
  pendingRender = false;
  const active = document.activeElement;
  const canPreserve = active && (active.tagName === "TEXTAREA" || active.tagName === "INPUT" || active.tagName === "SELECT") && active.id;
  const savedId = canPreserve ? active.id : null;
  const savedStart = canPreserve && typeof active.selectionStart === "number" ? active.selectionStart : null;
  const savedEnd = canPreserve && typeof active.selectionEnd === "number" ? active.selectionEnd : null;

  const app = document.getElementById("app");
  if (state.screen === "loading") app.innerHTML = `<div class="loading-screen">Loading…</div>`;
  else if (state.screen === "login") app.innerHTML = renderLogin();
  else if (state.screen === "position") app.innerHTML = renderPosition();
  else app.innerHTML = renderApp();

  if (savedId) {
    const el = document.getElementById(savedId);
    if (el) {
      el.focus();
      if (savedStart !== null && el.setSelectionRange) {
        try { el.setSelectionRange(savedStart, savedEnd); } catch (e) {}
      }
    }
  }
}
// 1s tick for live timers (only on screens that show them).
setInterval(() => {
  if (state.screen !== "app") return;
  if (!(state.tab === "day" || state.tab === "team") && !pendingRender) return;
  if (!safeToRerender()) return;
  render();
}, 1000);
// Background refresh so the team view / RS tickets stay current.
setInterval(() => {
  if (state.screen !== "app" || document.hidden) return;
  loadState().catch(e => console.warn(e));
}, POLL_MS);
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && state.screen === "app") loadState().catch(() => {});
});
document.addEventListener("focusout", () => {
  setTimeout(() => { if (pendingRender && safeToRerender()) render(); }, 0);
});

/* ============ LOGIN ============ */
function renderLogin() {
  const dots = Array.from({length:4}, (_,i) => `<div class="pin-dot ${i < state.pin.length ? "filled":""}"></div>`).join("");
  const keys = [1,2,3,4,5,6,7,8,9];
  return `
    <div class="login-screen">
      <div class="login-card">
        <div class="brand-row"><svg class="bolt" viewBox="0 0 24 24" fill="currentColor" style="color:var(--brand-gold)"><path d="M13 2 3 14h7l-1 8 11-14h-7l0-6z"/></svg></div>
        <h1>Lightning Repairs — Enter your PIN</h1>
        <div class="pin-dots">${dots}</div>
        <div class="pin-pad">
          ${keys.map(k => `<button class="pin-key" onclick="pinPress('${k}')">${k}</button>`).join("")}
          <button class="pin-key func" onclick="pinClear()">Clear</button>
          <button class="pin-key" onclick="pinPress('0')">0</button>
          <button class="pin-key func" onclick="pinBack()">⌫</button>
        </div>
        <div class="login-error">${esc(state.loginError)}</div>
      </div>
    </div>
  `;
}
function pinPress(d) {
  if (state.pin.length >= 4 || state.loggingIn) return;
  state.pin += d;
  state.loginError = "";
  if (state.pin.length === 4) tryLogin();
  render();
}
function pinBack() { state.pin = state.pin.slice(0,-1); render(); }
function pinClear() { state.pin = ""; state.loginError = ""; render(); }
document.addEventListener("keydown", e => {
  if (state.screen !== "login") return;
  if (/^[0-9]$/.test(e.key)) pinPress(e.key);
  else if (e.key === "Backspace") pinBack();
});

async function tryLogin() {
  state.loggingIn = true;
  try {
    const r = await api("/login", { pin: state.pin });
    state.token = r.token;
    store.set("lr_token", r.token);
    state.pin = "";
    await enterApp();
  } catch (e) {
    state.loginError = e.message;
    setTimeout(() => { state.pin = ""; render(); }, 500);
  } finally {
    state.loggingIn = false;
    render();
  }
}

// After a login (or on page load with a saved session): load data, then position picker or straight in.
async function enterApp() {
  const data = await api("/state");
  applyServerState(data);
  const me = state.currentUser;
  const todays = state.attendance[me.id];
  if (todays) {
    state.position = todays;
    state.screen = "app";
  } else if (me.positions.length <= 1) {
    state.position = me.positions[0] || "Manager";
    if (me.positions[0]) {
      await api("/position", { position: me.positions[0] }).catch(() => {});
      state.attendance[me.id] = me.positions[0];
    }
    state.screen = "app";
  } else {
    state.screen = "position";
  }
  applyRoute();
  render();
}

function renderPosition() {
  const p = state.currentUser;
  return `
    <div class="position-screen">
      <div class="position-card">
        <h1>Hey, ${esc(p.name.split(" ")[0])} 👋</h1>
        <div class="sub">What are you working today?</div>
        <div class="position-grid">
          ${p.positions.map(pos => `
            <button class="position-btn" onclick="pickPosition(${jsArg(pos)})">
              ${esc(pos)}
              <span class="goal">${GOALS[pos] ? "Goal: " + fmtHM(GOALS[pos].book) : "No repair goal"}</span>
            </button>
          `).join("")}
        </div>
      </div>
    </div>
  `;
}
async function pickPosition(pos) {
  state.position = pos;
  state.attendance[state.me] = pos;
  state.screen = "app";
  applyRoute();
  render();
  mutate("/position", { position: pos });
}

function logout(expired) {
  state.token = null;
  store.set("lr_token", null);
  state.currentUser = null;
  state.position = null;
  state.pin = "";
  state.loginError = expired === true ? "Session expired — enter your PIN again" : "";
  state.screen = "login";
  render();
}

/* ============ ROUTING (browser back/forward) ============ */
function routeFromState() {
  if (state.tab === "admin") {
    if (!state.adminSection) return "#/admin";
    if (state.adminSection === "booktime" && state.adminCategory) return `#/admin/booktime/${state.adminCategory}`;
    return `#/admin/${state.adminSection}`;
  }
  return "#/" + state.tab;
}
function applyRoute() {
  const parts = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean);
  let tab = parts[0] || "day";
  if (!["day", "team", "settings", "admin"].includes(tab)) tab = "day";
  if (tab === "admin" && !(state.currentUser && state.currentUser.admin)) tab = "day";
  state.tab = tab;
  state.adminSection = tab === "admin" ? (parts[1] || null) : null;
  state.adminCategory = tab === "admin" && parts[1] === "booktime" ? (parts[2] || null) : null;
  state.adminView = state.adminCategory ? "category" : "home";
  state.positionMenuOpen = false;
  if (state.adminSection === "rs" && !state.rsCheck && !state.rsCheckLoading) setTimeout(runRsCheck, 0);
  if (!location.hash) history.replaceState(null, "", routeFromState());
}
function navigate() {
  const h = routeFromState();
  if (location.hash !== h) location.hash = h; // hashchange → applyRoute + render
  else render();
}
window.addEventListener("hashchange", () => {
  if (state.screen !== "app") return;
  applyRoute();
  render();
});

/* ---------- main app shell ---------- */
function renderApp() {
  const u = state.currentUser;
  const isAdmin = !!u.admin;
  const myPositions = u.positions;
  const canSwitch = myPositions.length > 1;
  return `
    <div class="topbar">
      <div class="tabs">
        <button class="tab ${state.tab==='day'?'active':''}" onclick="setTab('day')">My Day</button>
        <button class="tab ${state.tab==='team'?'active':''}" onclick="setTab('team')">Team</button>
        <button class="tab ${state.tab==='settings'?'active':''}" onclick="setTab('settings')">Settings</button>
        ${isAdmin ? `<button class="tab ${state.tab==='admin'?'active':''}" onclick="setTab('admin')">Admin Console</button>` : ""}
      </div>
      <div class="who">
        <div class="pos-switcher">
          ${canSwitch
            ? `<button class="pos-badge clickable" onclick="togglePositionMenu()">${esc(state.position)} ${state.positionMenuOpen ? '▲' : '▾'}</button>`
            : `<span class="pos-badge">${esc(state.position)}</span>`
          }
          ${state.positionMenuOpen ? `
            <div class="pos-menu">
              ${myPositions.map(pos => `
                <button class="pos-menu-item ${pos === state.position ? 'current' : ''}" onclick="changePosition(${jsArg(pos)})">
                  ${esc(pos)}${pos === state.position ? ' ✓' : ''}
                </button>
              `).join("")}
            </div>
          ` : ""}
        </div>
        <div class="avatar" style="background:${esc(u.color)}">${esc(u.initials)}</div>
        <span>${esc(u.name)}</span>
        <button class="btn ghost small" style="color:#e8ecf3" onclick="logout()">Log out</button>
      </div>
    </div>
    <main class="content">
      ${state.rsError ? `<div class="rs-warning"><b>Can't reach RepairShopr right now</b> — showing what the app already knows. ${state.currentUser.admin ? `<br><span style="opacity:.8">${esc(state.rsError)}</span>` : ""}</div>` : ""}
      ${state.tab === 'day' ? renderDay() : state.tab === 'team' ? renderTeam() : state.tab === 'admin' ? renderAdmin() : renderSettings()}
    </main>
  `;
}
function setTab(t) {
  state.tab = t;
  state.positionMenuOpen = false;
  if (t !== "admin") { state.adminSection = null; state.adminCategory = null; state.adminView = "home"; }
  navigate();
}
function togglePositionMenu() { state.positionMenuOpen = !state.positionMenuOpen; render(); }
function changePosition(pos) {
  state.positionMenuOpen = false;
  mutate("/position", { position: pos }, () => { state.position = pos; state.attendance[state.me] = pos; });
}

/* ---------- My Day ---------- */
function ticketsFor(userId) { return state.tickets.filter(t => t.assignedTo === userId && !t.notOpen); }
function findTicket(id) { return state.tickets.find(x => x.id === id); }

// Book time = minutes credited today by claimed diagnoses/repairs. Time spent = everything logged today
// (+ the live running timer). Both come from the server, so every device agrees.
function computeTotals(userId) {
  const p = state.personToday[userId] || { bookSec: 0, spentSec: 0, runningSince: null };
  const live = p.runningSince ? Math.max(0, (nowMs() - p.runningSince) / 1000) : 0;
  return { book: Math.max(0, p.bookSec), spent: Math.max(0, p.spentSec + live) };
}
function meterBlock(title, actualSec, goalSec) {
  if (!goalSec) return "";
  const pct = Math.min(100, (actualSec/goalSec)*100);
  const d = new Date(nowMs());
  const hours = d.getHours() + d.getMinutes() / 60;
  const paceFrac = Math.min(1, Math.max(0, (hours - WORKDAY_START) / (WORKDAY_END - WORKDAY_START)));
  const expectedSec = goalSec * paceFrac;
  const diff = actualSec - expectedSec;
  const ahead = diff >= 0;
  const chip = `<span class="status-chip ${ahead ? 'good':'serious'}">${ahead ? '▲ Ahead' : '▼ Behind'} ${fmtHM(Math.abs(diff))}</span>`;
  return `
    <div class="meter-card">
      <div class="meter-top">
        <span class="meter-title">${title}</span>
        ${chip}
      </div>
      <div class="meter-value">${fmtHM(actualSec)} <span class="of">/ ${fmtHM(goalSec)} goal</span></div>
      <div class="meter-track">
        <div class="meter-fill" style="width:${pct}%"></div>
        <div class="meter-pace" style="left:${paceFrac*100}%" title="Expected pace right now"></div>
      </div>
      <div class="meter-note">Grey tick = where you'd be on pace right now (9a–6p day)</div>
    </div>
  `;
}
function renderCreditBadges(t) {
  const badges = [];
  if (t.diagnosisClaimedBy) {
    badges.push(`<span class="diag-badge" title="Diagnosis credit claimed">🩺 ${esc(firstName(t.diagnosisClaimedBy))} &middot; ${esc(t.diagnosisClaimedAt)}</span>`);
  } else if (t.diagnosisLocked) {
    badges.push(`<span class="diag-badge" title="Diagnosis closed out — repair was completed before anyone claimed it">🩺 closed</span>`);
  }
  if (t.repairClaimedBy) {
    const typeLabel = t.repairType ? ` &middot; ${esc(t.repairType)}` : "";
    badges.push(`<span class="diag-badge" title="Repair credit claimed">&#128295; ${esc(firstName(t.repairClaimedBy))}${typeLabel} &middot; ${esc(t.repairClaimedAt)}</span>`);
  }
  return badges.join("");
}
// Worked on it today = assigned to them at some point today AND left at least one note today
// (a note from this app, or a comment they typed in RepairShopr).
function workedOnToday(t, userId) {
  const assignedToday = t.assignedTo === userId || (t.assignmentLog || []).some(e => e.personId === userId && e.date === state.today);
  const notedToday = (t.notes || []).some(n => n.author === userId && n.date === state.today);
  return assignedToday && notedToday;
}
function hasActedToday(t, userId) { return (t.workLog || []).some(w => w.personId === userId && w.date === state.today); }
function todaysEntry(t, userId) { return (t.workLog || []).find(w => w.personId === userId && w.date === state.today) || null; }
function isDiagnosisStatus(t) { return state.diagnosisEligibleStatuses.includes(t.status); }
function ticketsEligibleForDiagnosisCredit(userId) {
  return state.tickets.filter(t =>
    !t.notOpen &&
    (!t.diagnosisLocked || !t.repairLocked) &&
    isDiagnosisStatus(t) &&
    workedOnToday(t, userId) &&
    !hasActedToday(t, userId)
  );
}

/* ----- device / repair-type picker ----- */
function persistDevice(t) {
  recomputeBookedSec(t);
  render();
  mutate("/device", {
    ticketId: t.id,
    category: t.deviceOverrideCategory || null,
    subtype: t.deviceOverrideSubtype || null,
    row: t.deviceRow || null,
    repairType: t.repairType || null,
  });
}
// Category/Subtype come from RS's Issue Type. These two setters are only for correcting it
// (e.g. RS has no "Handheld" Issue Type, so a Switch ticket maps to Console until corrected).
function setTicketDeviceCategory(ticketId, val) {
  const t = findTicket(ticketId);
  t.deviceOverrideCategory = val || null;
  t.deviceOverrideSubtype = null;
  t.deviceRow = null; t.repairType = null;
  resolveDevice(t);
  persistDevice(t);
}
function setTicketDeviceSubtype(ticketId, val) {
  const t = findTicket(ticketId);
  const mapped = t.issueType ? ISSUE_TYPE_TO_DEVICE[t.issueType] : null;
  // Picking the same subtype Issue Type already implies just clears the override.
  t.deviceOverrideSubtype = (!t.deviceOverrideCategory && mapped && mapped.subtype === val) ? null : (val || null);
  t.deviceRow = null; t.repairType = null;
  resolveDevice(t);
  state.deviceOverrideOpen = null;
  persistDevice(t);
}
function setTicketDeviceRow(ticketId, val) {
  const t = findTicket(ticketId);
  t.deviceRow = val || null;
  t.repairType = null;
  persistDevice(t);
}
function setTicketRepairType(ticketId, val) {
  const t = findTicket(ticketId);
  t.repairType = val || null;
  persistDevice(t);
}
function toggleDeviceOverride(ticketId) {
  state.deviceOverrideOpen = (state.deviceOverrideOpen === ticketId) ? null : ticketId;
  render();
}
// Show the category dropdown for this ticket (nothing is saved until a category is actually picked).
function pickOtherCategory(ticketId) {
  const t = findTicket(ticketId);
  t.deviceCategory = null; t.deviceSubtype = null;
  state.deviceOverrideOpen = ticketId;
  render();
}
function deviceCategoryIcon(cat) {
  return cat === "mobile" ? "📱" : cat === "computer" ? "💻" : cat === "gaming" ? "🎮" : "🔧";
}
function renderDevicePicker(t) {
  const cats = state.bookTimeCategories;
  const overrideOpen = state.deviceOverrideOpen === t.id;

  if (!t.deviceCategory || !cats[t.deviceCategory] || !t.deviceSubtype || !cats[t.deviceCategory].subtypes[t.deviceSubtype]) {
    // Issue Type didn't map to a device (Service/Consult, Other/Misc, blank) — let them set it by hand.
    const catOpts = Object.keys(cats).map(k =>
      `<option value="${esc(k)}" ${t.deviceCategory === k ? "selected" : ""}>${esc(cats[k].label.replace(" Book Times", ""))}</option>`
    ).join("");
    const pickedCat = t.deviceCategory && cats[t.deviceCategory];
    const subSelect = pickedCat ? `
      <select class="device-select" onchange="setTicketDeviceSubtype(${t.id}, this.value)">
        <option value="" selected disabled>Sub-type…</option>
        ${Object.keys(pickedCat.subtypes).map(k => `<option value="${esc(k)}">${esc(pickedCat.subtypes[k].label)}</option>`).join("")}
      </select>` : "";
    return (overrideOpen || pickedCat)
      ? `<div class="device-picker-row">
           <select class="device-select" onchange="setTicketDeviceCategory(${t.id}, this.value)">
             <option value="" ${!pickedCat ? "selected" : ""} disabled>Category…</option>${catOpts}
           </select>
           ${subSelect}
         </div>`
      : `<button type="button" class="device-chip clickable" onclick="toggleDeviceOverride(${t.id})" title="Click to set a device manually">⚠ ${t.issueType ? `No book-time category for Issue Type "${esc(t.issueType)}"` : "No Issue Type on this ticket"} — set manually</button>`;
  }

  const cat = cats[t.deviceCategory];
  const sub = cat.subtypes[t.deviceSubtype];
  const subOpts = Object.keys(cat.subtypes).map(k =>
    `<option value="${esc(k)}" ${t.deviceSubtype === k ? "selected" : ""}>${esc(cat.subtypes[k].label)}</option>`
  ).join("");
  const rowOpts = sub.rows.map(r =>
    `<option value="${esc(r)}" ${t.deviceRow === r ? "selected" : ""}>${esc(r)}</option>`
  ).join("");
  const repairOpts = repairColumnsFor(t).map(col => {
    const mins = repairMinutesFor(t, col);
    return `<option value="${esc(col)}" ${t.repairType === col ? "selected" : ""}>${esc(col)}${mins ? ` (${mins}m)` : ""}</option>`;
  }).join("");
  const diagMin = diagnosticsMinutesFor(t);
  const repairMin = t.repairType ? repairMinutesFor(t, t.repairType) : null;
  const summaryParts = [];
  if (diagMin) summaryParts.push(`Diagnostics ${diagMin}m`);
  if (t.repairType && repairMin) summaryParts.push(`${esc(t.repairType)} ${repairMin}m`);
  const summary = summaryParts.length
    ? `${summaryParts.join(" + ")} = ${fmtHM(t.bookedSec)} book time`
    : "Pick the model & repair type to set this ticket's book time.";

  const chipOrOverride = overrideOpen
    ? `<select class="device-select" onchange="setTicketDeviceSubtype(${t.id}, this.value)">${subOpts}</select>
       <button type="button" class="btn ghost small" onclick="pickOtherCategory(${t.id})" title="Pick a different category">Other category…</button>`
    : `<button type="button" class="device-chip clickable" onclick="toggleDeviceOverride(${t.id})" title="${t.deviceOverrideCategory || t.deviceOverrideSubtype ? "Set by hand" : `Pulled from RepairShopr Issue Type: ${esc(t.issueType || "")}`} — click to correct">${deviceCategoryIcon(t.deviceCategory)} ${esc(sub.label)}</button>`;

  return `
    <div class="device-picker">
      <div class="device-picker-row">
        ${chipOrOverride}
        <select class="device-select" onchange="setTicketDeviceRow(${t.id}, this.value)">
          <option value="" ${!t.deviceRow ? "selected" : ""} disabled>Model…</option>
          ${rowOpts}
        </select>
        <select class="device-select" onchange="setTicketRepairType(${t.id}, this.value)" ${!t.deviceRow ? "disabled" : ""}>
          <option value="" ${!t.repairType ? "selected" : ""} disabled>Repair type…</option>
          ${repairOpts}
        </select>
      </div>
      <div class="device-picker-note">${summary}</div>
    </div>
  `;
}

/* ----- diagnosis / repair credit ----- */
function outcomeOptionsFor(t, forceInclude) {
  const diagMin = diagnosticsMinutesFor(t);
  const diagPair = [
    { value: "diagnosis_completed", label: diagMin ? `Claim Completed Diagnosis (${diagMin}m)` : "Claim Completed Diagnosis" },
    { value: "diagnosis_incomplete", label: "Did not complete diagnosis" },
  ];
  const repairMin = t.repairType ? repairMinutesFor(t, t.repairType) : null;
  const repairLabel = t.repairType
    ? `Claim Completed Repair — ${t.repairType}${repairMin ? ` (${repairMin}m)` : ""}`
    : "Claim Completed Repair (pick a repair type for book time)";
  const repairPair = [
    { value: "repair_completed", label: repairLabel },
    { value: "repair_incomplete", label: "Did not complete repair" },
  ];
  const opts = [];
  if (!t.diagnosisLocked || diagPair.some(o => o.value === forceInclude)) opts.push(...diagPair);
  if (!t.repairLocked || repairPair.some(o => o.value === forceInclude)) opts.push(...repairPair);
  return opts;
}
function reverseOutcomeEffects(t, outcome, personId) {
  if (outcome === 'diagnosis_completed' && t.diagnosisClaimedBy === personId) {
    t.diagnosisClaimedBy = null; t.diagnosisClaimedAt = null; t.diagnosisLocked = false;
  } else if (outcome === 'repair_completed' && t.repairClaimedBy === personId) {
    t.repairClaimedBy = null; t.repairClaimedAt = null; t.repairLocked = false;
    if (!t.diagnosisClaimedBy) t.diagnosisLocked = false;
  }
}
function applyOutcomeEffects(t, outcome, personId) {
  if (outcome === 'diagnosis_completed') {
    t.diagnosisClaimedBy = personId; t.diagnosisClaimedAt = state.today; t.diagnosisLocked = true;
  } else if (outcome === 'repair_completed') {
    t.repairClaimedBy = personId; t.repairClaimedAt = state.today; t.repairLocked = true;
    if (!t.diagnosisLocked) t.diagnosisLocked = true;
  }
}
// Single entry point for every outcome dropdown. Replaces whatever this user already logged today
// for the ticket (reversing its effects first), or clears it when newOutcome is blank.
function setOutcome(ticketId, newOutcome) {
  const t = findTicket(ticketId);
  const personId = state.me;
  state.outcomeEditOpen = null;
  mutate("/outcome", { ticketId, outcome: newOutcome || null }, () => {
    const existing = todaysEntry(t, personId);
    if (existing) {
      reverseOutcomeEffects(t, existing.outcome, personId);
      if (!newOutcome) t.workLog = t.workLog.filter(w => w !== existing);
      else { existing.outcome = newOutcome; existing.loggedAt = nowMs(); applyOutcomeEffects(t, newOutcome, personId); }
    } else if (newOutcome) {
      t.workLog = t.workLog || [];
      t.workLog.push({ personId, date: state.today, outcome: newOutcome, loggedAt: nowMs() });
      applyOutcomeEffects(t, newOutcome, personId);
    }
  });
}
function renderOutcomeSelect(t, selectedOutcome, idSuffix) {
  const opts = outcomeOptionsFor(t, selectedOutcome);
  if (!opts.length) return "";
  const placeholder = selectedOutcome
    ? `<option value="">— clear my answer —</option>`
    : `<option value="" disabled selected>Select outcome…</option>`;
  const optionsHtml = opts.map(o =>
    `<option value="${o.value}" ${o.value === selectedOutcome ? "selected" : ""}>${esc(o.label)}</option>`
  ).join("");
  return `<select id="outcome-select-${t.id}${idSuffix || ""}" class="outcome-select" onchange="setOutcome(${t.id}, this.value)">${placeholder}${optionsHtml}</select>`;
}
function renderDiagnosisRow(t) {
  return `
    <div class="ticket-row diag-row">
      ${ticketLink(t)}
      ${statusPill(t)}
      <div class="diag-actions">
        ${renderDevicePicker(t)}
        ${renderOutcomeSelect(t, null, "-diag")}
      </div>
    </div>
  `;
}
function outcomeBadgeLabel(w, t) {
  if (w.outcome === "repair_completed") return t.repairType ? `Completed Repair — ${t.repairType}` : "Completed Repair";
  return OUTCOME_LABELS[w.outcome] || w.outcome;
}
function toggleOutcomeEdit(ticketId) {
  state.outcomeEditOpen = (state.outcomeEditOpen === ticketId) ? null : ticketId;
  render();
  if (state.outcomeEditOpen === ticketId) {
    const el = document.getElementById(`outcome-select-${ticketId}`);
    if (el) {
      el.focus();
      if (typeof el.showPicker === "function") { try { el.showPicker(); } catch (e) {} }
    }
  }
}
function renderWorkedOnTodayList(userId) {
  const entries = [];
  state.tickets.forEach(t => { const w = todaysEntry(t, userId); if (w) entries.push({ t, w }); });
  if (!entries.length) return "";
  entries.sort((a, b) => b.w.loggedAt - a.w.loggedAt);
  return `
    <div class="panel">
      <h2>Tickets I worked on today</h2>
      ${entries.map(({t, w}) => `
        <div class="ticket-row diag-row">
          ${ticketLink(t)}
          <div class="diag-actions">
            ${state.outcomeEditOpen === t.id
              ? `${renderDevicePicker(t)}${renderOutcomeSelect(t, w.outcome)}`
              : `<button type="button" class="work-outcome-badge clickable ${w.outcome}" onclick="toggleOutcomeEdit(${t.id})" title="Click to change">${esc(outcomeBadgeLabel(w, t))}${w.creditedMinutes ? ` &middot; ${w.creditedMinutes}m` : ""}</button>`}
          </div>
        </div>
      `).join("")}
    </div>
  `;
}
function renderDay() {
  const goals = GOALS[state.position];
  const totals = computeTotals(state.me);
  const tickets = ticketsFor(state.me);

  const meters = goals
    ? `<div class="meters-row">
         ${meterBlock("Book time completed", totals.book, goals.book)}
         ${meterBlock("Time spent", totals.spent, goals.spent)}
       </div>`
    : `<div class="panel"><div class="meter-note">No repair-time goal for ${esc(state.position)} today.</div></div>`;

  const diagCandidates = ticketsEligibleForDiagnosisCredit(state.me);
  const diagIds = new Set(diagCandidates.map(t => t.id));
  const ticketRows = tickets.length ? tickets.map(t => renderTicketRow(t, diagIds.has(t.id))).join("") : `<div class="meter-note">No tickets assigned to you in RepairShopr right now.</div>`;
  const statusList = state.diagnosisEligibleStatuses.join(", ") || "(none set — Admin Console → RepairShopr)";
  const diagSection = diagCandidates.length ? `
    <div class="panel">
      <h2>Diagnosis credit available</h2>
      <div class="meter-note" style="margin-bottom:8px;">Tickets you worked on today (assigned to you + a note from you today) sitting in ${esc(statusList)}. Diagnosis and repair credit are each one-time, permanent, and separate — claiming repair also closes out diagnosis for good.</div>
      ${diagCandidates.map(t => renderDiagnosisRow(t)).join("")}
    </div>
  ` : "";

  return `
    ${meters}
    ${diagSection}
    <div class="panel">
      <h2>Your assigned tickets</h2>
      ${ticketRows}
    </div>
    ${renderWorkedOnTodayList(state.me)}
  `;
}
function renderTicketRow(t, inDiagPanel) {
  const running = t.timerState === "running";
  const paused = t.timerState === "paused";
  const logged = t.timerState === "logged";
  const note = state.noteDrafts[t.id] ?? "";
  const manualVal = state.manualDrafts[t.id] ?? "";
  const confirm = state.manualConfirm[t.id];

  let timerClass = running ? "running" : paused ? "paused" : "";
  let icon = "", tooltipAttr = "";
  if (logged) {
    const v = bookTimeVerdict(t.spentSec, t.bookedSec);
    timerClass = `logged-${v.tier}`;
    icon = v.icon + " ";
    tooltipAttr = v.tooltip ? ` title="${esc(v.tooltip)}"` : "";
  }

  const controls = running
    ? `<button class="icon-btn stop" onclick="toggleTimer(${t.id},'pause')" title="Pause">❚❚</button>
       <button class="icon-btn stop" onclick="toggleTimer(${t.id},'stop')" title="Stop &amp; log time">■</button>`
    : `<button class="icon-btn play" onclick="toggleTimer(${t.id},'start')" title="${logged ? 'Start a new timer segment' : paused ? 'Resume' : 'Start'}">▶</button>
       ${paused ? `<button class="icon-btn stop" onclick="toggleTimer(${t.id},'stop')" title="Stop &amp; log time">■</button>` : ""}`;

  // Claim credit right from the ticket (any status). Diagnosis-status tickets you worked on today get
  // their dropdown in the "Diagnosis credit available" panel instead, so it's never shown twice.
  const myEntry = todaysEntry(t, state.me);
  const outcomeArea = myEntry
    ? `<span class="work-outcome-badge ${myEntry.outcome}" title="Change it in “Tickets I worked on today” below">${esc(outcomeBadgeLabel(myEntry, t))}</span>`
    : (inDiagPanel ? "" : renderOutcomeSelect(t, null, "-row"));

  return `
    <div class="ticket-row" data-id="${t.id}">
      ${ticketLink(t)}
      ${statusPill(t)}
      ${renderCreditBadges(t)}
      <div class="timer-controls">
        <div class="timer-display ${timerClass}"${tooltipAttr}>${icon}${fmtClock(liveSpentSec(t))}</div>
        ${controls}
      </div>
      <div class="ticket-actions">
        <button class="btn ghost small" onclick="toggleNote(${t.id})">📝 Note</button>
        <button class="btn ghost small" onclick="toggleManual(${t.id})">⏱ Manual time</button>
      </div>
    </div>
    <div class="device-inline-row">
      ${renderDevicePicker(t)}
    </div>
    ${outcomeArea ? `<div class="inline-outcome">${outcomeArea}</div>` : ""}
    <div class="note-box" style="display:${state.noteOpen === t.id ? 'flex':'none'}; padding: 0 4px 10px;">
      <textarea id="note-input-${t.id}" data-draft="1" rows="2" placeholder="Quick note — also posts to the RepairShopr ticket as a private comment" oninput="draftNote(${t.id}, this.value)">${esc(note)}</textarea>
      <button class="btn small primary" onclick="saveNote(${t.id})">Save</button>
    </div>
    <div class="note-box" style="display:${state.manualOpen === t.id ? 'flex':'none'}; padding: 0 4px 4px; flex-direction: column;">
      <div style="display:flex; gap:8px;">
        <input id="manual-input-${t.id}" data-draft="1" type="number" min="0" step="1" placeholder="total minutes spent" value="${esc(manualVal)}" oninput="draftManual(${t.id}, this.value)">
        <button class="btn small primary" onclick="pushManualTime(${t.id})">Set time</button>
      </div>
      <div class="manual-hint">This SETS your total logged time on this ticket to exactly what you enter — it replaces whatever's tracked so far${running ? ", and stops the running timer" : ""}, it doesn't add on top.</div>
      ${confirm != null ? `<div class="manual-confirm">✓ Set your total to ${confirm}m</div>` : ""}
    </div>
  `;
}
function toggleTimer(id, action) {
  const t = findTicket(id);
  mutate("/timer", { ticketId: id, action }, () => {
    if (action === 'start') {
      // one running timer per person — starting a new one PAUSES the other (never logs it)
      state.tickets.forEach(other => {
        if (other.id !== t.id && other.timerState === 'running') { finalizeElapsed(other); other.timerState = 'paused'; }
      });
      t.timerState = 'running';
      t.runningSince = nowMs();
    }
    if (action === 'pause') { finalizeElapsed(t); t.timerState = 'paused'; }
    if (action === 'stop') { finalizeElapsed(t); t.timerState = 'logged'; }
  });
}
function toggleNote(id) {
  state.noteOpen = state.noteOpen === id ? null : id;
  state.manualOpen = null;
  render();
  if (state.noteOpen === id) document.getElementById(`note-input-${id}`)?.focus();
}
function draftNote(id, val) { state.noteDrafts[id] = val; }
async function saveNote(id) {
  const text = (state.noteDrafts[id] || "").trim();
  if (!text) return;
  const r = await mutate("/note", { ticketId: id, text }, () => {
    const t = findTicket(id);
    t.notes = t.notes || [];
    t.notes.push({ author: state.me, date: state.today });
    state.noteDrafts[id] = "";
    state.noteOpen = null;
  });
  if (r && !r.rsPosted) showToast("Note saved in the app, but it couldn't be posted to RepairShopr" + (r.rsError ? `: ${r.rsError}` : ""), "error");
  else if (r) showToast("Note saved & posted to RepairShopr");
}
function toggleManual(id) {
  state.manualOpen = state.manualOpen === id ? null : id;
  state.noteOpen = null;
  render();
  if (state.manualOpen === id) document.getElementById(`manual-input-${id}`)?.focus();
}
function draftManual(id, val) { state.manualDrafts[id] = val; }
// SETS the total (not additive) and stops the timer.
function pushManualTime(id) {
  const raw = state.manualDrafts[id];
  const minutes = Number(raw);
  if (raw === undefined || raw === "" || !Number.isFinite(minutes) || minutes < 0) return;
  mutate("/manual-time", { ticketId: id, minutes }, () => {
    const t = findTicket(id);
    t.runningSince = null;
    t.spentSec = minutes * 60;
    t.timerState = 'logged';
    state.manualDrafts[id] = "";
    state.manualConfirm[id] = minutes;
    state.manualOpen = null;
  });
}

/* ---------- Team tab ---------- */
function activePeople() { return Object.values(PEOPLE).filter(p => p.active); }
function renderTeam() {
  const loggedInToday = Object.keys(state.attendance).filter(id => PEOPLE[id]);
  const rows = loggedInToday.map(id => {
    const p = PEOPLE[id];
    const pos = id === state.me ? state.position : state.attendance[id];
    const goals = GOALS[pos];
    const totals = computeTotals(id);
    const tickets = ticketsFor(id);
    const anyRunning = !!(state.personToday[id] && state.personToday[id].runningSince);
    const bookPct = goals ? Math.min(100,(totals.book/goals.book)*100) : 0;
    const spentPct = goals ? Math.min(100,(totals.spent/goals.spent)*100) : 0;
    return `
      <tr>
        <td><div class="person-cell"><div class="avatar" style="background:${esc(p.color)}">${esc(p.initials)}</div>${esc(p.name)}${anyRunning ? '<span class="live-dot" style="margin-left:8px" title="Timer running"></span>' : ''}</div></td>
        <td>${esc(pos)}</td>
        <td>${goals ? `<div class="mini-meter-track"><div class="mini-meter-fill" style="width:${bookPct}%"></div></div>${fmtHM(totals.book)} / ${fmtHM(goals.book)}` : '—'}</td>
        <td>${goals ? `<div class="mini-meter-track"><div class="mini-meter-fill" style="width:${spentPct}%"></div></div>${fmtHM(totals.spent)} / ${fmtHM(goals.spent)}` : '—'}</td>
        <td>${tickets.length}</td>
      </tr>
    `;
  }).join("");
  const otherAssigned = state.tickets.filter(t => !t.notOpen && !t.assignedTo && t.assignedRsUserId != null);
  return `
    <div class="panel">
      <h2>Today's team</h2>
      ${loggedInToday.length ? `
      <table>
        <thead><tr><th>Person</th><th>Position</th><th>Book time</th><th>Time spent</th><th>Tickets</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>` : `<div class="meter-note">Nobody's logged in yet today.</div>`}
    </div>
    <div class="panel">
      <h2>All tickets in queue</h2>
      ${renderQueueGroup("unassigned", "Unassigned", null, state.tickets.filter(t => !t.notOpen && t.assignedRsUserId == null))}
      ${activePeople().map(p => renderQueueGroup(p.id, p.name, p.color, ticketsFor(p.id))).join("")}
      ${otherAssigned.length ? renderQueueGroup("other", "Assigned in RepairShopr to someone not in this app", null, otherAssigned) : ""}
    </div>
  `;
}
function renderQueueGroup(groupKey, label, color, tickets) {
  const collapsed = state.collapsedGroups.has(groupKey);
  const swatch = color ? `<span class="avatar" style="background:${esc(color)};width:20px;height:20px;font-size:9px;margin-right:8px">${esc((label.match(/\b\w/g)||[]).join('').slice(0,2))}</span>` : `<span style="margin-right:8px;color:var(--text-muted)">—</span>`;
  return `
    <div class="queue-group">
      <button class="queue-group-header" onclick="toggleGroup(${jsArg(groupKey)})">
        <span class="queue-caret">${collapsed ? '▶' : '▼'}</span>
        ${swatch}
        <span class="queue-group-label">${esc(label)}</span>
        <span class="queue-group-count">${tickets.length}</span>
      </button>
      ${collapsed ? "" : (tickets.length
        ? `<div class="queue-group-body">${tickets.map(t => renderQueueRow(t)).join("")}</div>`
        : `<div class="queue-group-body"><div class="meter-note" style="padding:8px 10px">Nothing here.</div></div>`)}
    </div>
  `;
}
function renderQueueRow(t) {
  const isMine = t.assignedTo === state.me;
  const isAdmin = !!state.currentUser.admin;
  const assignControl = isAdmin
    ? `
      <label class="assign-select-wrap">
        <span class="assign-select-label">Assign to:</span>
        <select class="assign-select" onchange="reassignTicket(${t.id}, this.value)">
          <option value="" ${t.assignedRsUserId == null ? "selected" : ""}>Unassigned</option>
          ${!t.assignedTo && t.assignedRsUserId != null ? `<option value="" selected disabled>(someone not in this app)</option>` : ""}
          ${activePeople().map(p => `<option value="${esc(p.id)}" ${t.assignedTo === p.id ? "selected" : ""} ${p.rsUserId == null ? "disabled" : ""}>${esc(p.name)}${p.rsUserId == null ? " (not linked to RS)" : ""}</option>`).join("")}
        </select>
      </label>
    `
    : (isMine
        ? `<span class="status-chip good">Assigned to you</span>`
        : `<button class="btn small primary" onclick="assignToMe(${t.id})">Assign to me</button>`
      );
  return `
    <div class="ticket-row">
      ${ticketLink(t)}
      ${statusPill(t)}
      ${renderCreditBadges(t)}
      ${assignControl}
    </div>
  `;
}
function reassignTicket(ticketId, personIdOrEmpty) {
  mutate("/assign", { ticketId, personId: personIdOrEmpty || null }, () => {
    const t = findTicket(ticketId);
    t.assignedTo = personIdOrEmpty || null;
    t.assignedRsUserId = personIdOrEmpty ? PEOPLE[personIdOrEmpty].rsUserId : null;
  });
}
function toggleGroup(key) {
  if (state.collapsedGroups.has(key)) state.collapsedGroups.delete(key); else state.collapsedGroups.add(key);
  render();
}
function assignToMe(ticketId) {
  if (state.currentUser.rsUserId == null) { showToast("You're not linked to a RepairShopr user yet — ask Samuel to link you in Admin Console → Users", "error"); return; }
  reassignTicket(ticketId, state.me);
}

/* ---------- Admin console ---------- */
const ADMIN_MENU = [
  { key: "users",    icon: "👤", label: "Users",                  desc: "Positions, PINs & RepairShopr links per person" },
  { key: "booktime", icon: "📊", label: "Book Time Database",     desc: "Standard repair times by device type" },
  { key: "rs",       icon: "🔌", label: "RepairShopr connection", desc: "Check the API link, statuses & Issue Types" },
  { key: "reports",  icon: "📈", label: "Reports",                desc: "Coming soon" },
];
function renderAdmin() {
  if (!state.adminSection) return renderAdminMenu();
  if (state.adminSection === "users") return renderAdminUsers();
  if (state.adminSection === "rs") return renderAdminRs();
  if (state.adminSection === "reports") return renderAdminReports();
  if (state.adminView === "category" && state.bookTimeCategories[state.adminCategory]) return renderBookTimeCategory();
  return renderBookTimeHome();
}
function renderAdminMenu() {
  return `
    <div class="panel">
      <h2>Admin Console</h2>
      <div class="admin-menu">
        ${ADMIN_MENU.map(it => `
          <button class="admin-menu-item" onclick="openAdminSection('${it.key}')">
            <span class="admin-menu-icon">${it.icon}</span>
            <span class="admin-menu-text">
              <span class="admin-menu-label">${it.label}</span>
              <span class="admin-menu-desc">${it.desc}</span>
            </span>
            <span class="admin-menu-chevron">&rsaquo;</span>
          </button>
        `).join("")}
      </div>
    </div>
  `;
}
function backCrumb() { return `<div class="breadcrumb"><button class="btn ghost small" onclick="backToAdminHome()">&larr; Admin Console</button></div>`; }

function renderAdminUsers() {
  const rsOpts = (selected) => `
    <option value="" ${selected == null ? "selected" : ""}>— not linked —</option>
    ${state.rsUsers.map(u => `<option value="${esc(u.id)}" ${String(selected) === String(u.id) ? "selected" : ""}>${esc(u.name)}</option>`).join("")}
    ${selected != null && !state.rsUsers.some(u => String(u.id) === String(selected)) ? `<option value="${esc(selected)}" selected>RS user #${esc(selected)}</option>` : ""}`;
  const peopleRows = Object.values(PEOPLE).map(p => `
    <tr style="${p.active ? "" : "opacity:.5"}">
      <td><div class="person-cell"><div class="avatar" style="background:${esc(p.color)}">${esc(p.initials)}</div>${esc(p.name)}${p.admin ? ' <span class="pin-state">(admin)</span>' : ""}</div></td>
      <td>${POSITIONS.map(pos => `
        <label class="role-check">
          <input type="checkbox" ${p.positions.includes(pos) ? "checked":""} onchange="toggleRole(${jsArg(p.id)}, ${jsArg(pos)})">
          ${pos}
        </label>
      `).join("")}</td>
      <td>
        <select class="admin-input" onchange="linkRsUser(${jsArg(p.id)}, this.value)" ${state.rsUsers.length ? "" : "title='RepairShopr users not loaded'"}>${rsOpts(p.rsUserId)}</select>
      </td>
      <td style="white-space:nowrap">
        <input id="pin-input-${esc(p.id)}" data-draft="1" class="admin-input pin-input" type="password" inputmode="numeric" maxlength="4" placeholder="4 digits" value="${esc(state.pinDrafts[p.id] || "")}" oninput="state.pinDrafts[${jsArg(p.id)}] = this.value">
        <button class="btn small" onclick="savePin(${jsArg(p.id)})">Set</button>
        <span class="pin-state ${p.hasPin ? "ok" : ""}">${p.hasPin ? "✓ has PIN" : "no PIN yet"}</span>
      </td>
      <td>${p.id === state.me ? "" : `<button class="btn ghost small" onclick="setActive(${jsArg(p.id)}, ${!p.active})">${p.active ? "Deactivate" : "Reactivate"}</button>`}</td>
    </tr>
  `).join("");
  return `
    <div class="panel" style="overflow-x:auto;">
      ${backCrumb()}
      <h2>Users</h2>
      <div class="meter-note" style="margin-bottom:10px;">The RepairShopr link is how the app knows which RS tickets are whose. People are auto-linked when their name matches an RS user exactly.</div>
      <table>
        <thead><tr><th>Person</th><th>Assigned positions</th><th>RepairShopr user</th><th>PIN</th><th></th></tr></thead>
        <tbody>${peopleRows}</tbody>
      </table>
      <div style="margin-top:14px; display:flex; gap:8px; align-items:center;">
        <input id="new-person-name" data-draft="1" class="admin-input" placeholder="Full name" value="${esc(state.newPersonName)}" oninput="state.newPersonName = this.value" style="width:220px">
        <button class="btn small primary" onclick="addPerson()">Add person</button>
      </div>
    </div>
  `;
}
function toggleRole(personId, pos) {
  const p = PEOPLE[personId];
  const next = p.positions.includes(pos) ? p.positions.filter(x => x !== pos) : POSITIONS.filter(x => x === pos || p.positions.includes(x));
  mutate("/admin/person", { id: personId, positions: next }, () => { p.positions = next; });
}
function linkRsUser(personId, rsUserId) {
  mutate("/admin/person", { id: personId, rsUserId: rsUserId || null }, () => { PEOPLE[personId].rsUserId = rsUserId ? Number(rsUserId) : null; });
}
async function savePin(personId) {
  const pin = (state.pinDrafts[personId] || "").trim();
  if (!/^[0-9]{4}$/.test(pin)) { showToast("PIN must be exactly 4 digits", "error"); return; }
  const r = await mutate("/admin/pin", { personId, pin });
  if (r) { state.pinDrafts[personId] = ""; showToast(`PIN set for ${PEOPLE[personId].name}`); render(); }
}
function setActive(personId, active) { mutate("/admin/person", { id: personId, active }); }
async function addPerson() {
  const name = state.newPersonName.trim();
  if (!name) return;
  const r = await mutate("/admin/person", { create: true, name });
  if (r) { state.newPersonName = ""; showToast(`Added ${name} — set their PIN and positions`); render(); }
}

function renderAdminReports() {
  return `
    <div class="panel">
      ${backCrumb()}
      <h2>Reports</h2>
      <div class="meter-note">Nothing here yet — tell me what you want tracked and we'll build it out.</div>
    </div>
  `;
}

/* ----- RepairShopr connection check ----- */
async function runRsCheck() {
  state.rsCheckLoading = true; render();
  try { state.rsCheck = await api("/admin/rs-check"); }
  catch (e) { state.rsCheck = { ok: false, errors: [e.message] }; }
  state.rsCheckLoading = false; render();
}
function toggleEligibleStatus(status) {
  const cur = state.diagnosisEligibleStatuses;
  const next = cur.includes(status) ? cur.filter(s => s !== status) : [...cur, status];
  mutate("/admin/eligible-statuses", { statuses: next }, () => { state.diagnosisEligibleStatuses = next; });
}
function copyRaw() {
  const el = document.getElementById("rs-raw");
  if (!el) return;
  navigator.clipboard?.writeText(el.textContent).then(() => showToast("Copied"), () => showToast("Couldn't copy — select it by hand", "error"));
}
function renderAdminRs() {
  const c = state.rsCheck;
  const seenStatuses = c && c.statuses ? c.statuses : [];
  const allStatuses = [...seenStatuses.map(s => s.value), ...state.diagnosisEligibleStatuses.filter(s => !seenStatuses.some(x => x.value === s))];
  const statusChecks = allStatuses.map(s => {
    const seen = seenStatuses.find(x => x.value === s);
