<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lightning Repairs — Tech Tool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<style>
  /* Three themes: Light (default), Dark (logo navy), Retro (logo sky blue + yellow).
     Status colors (good/warning/serious/critical) are fixed in every theme. */
  :root {
    color-scheme: light;
    --brand-navy: #0b1e3d;   /* the logo's outline navy */
    --brand-blue: #1596d1;   /* the logo's sky blue */
    --brand-gold: #ffcc00;   /* the logo's lightning-bolt yellow */

    /* Light: white, black/grey text */
    --page: #ffffff;
    --surface: #ffffff;
    --surface-2: #f3f4f6;
    --text-primary: #111111;
    --text-secondary: #4b4f56;
    --text-muted: #8a8f98;
    --grid: #e5e7eb;
    --baseline: #c7cbd1;
    --border: rgba(17,17,17,0.12);
    --accent: var(--brand-blue);
    --book: #1580c0;      /* 📖 book time — blue everywhere */
    --actual: #7a3fd6;    /* ⏱ actual time — purple everywhere */

    --topbar-bg: #ffffff;
    --topbar-text: #111111;
    --topbar-tab: #6b7079;
    --topbar-line: #e5e7eb;
    --tab-active: #111111;
    --badge-bg: #f0f1f3;
    --login-bg: #f3f4f6;
    --primary-bg: #111111;
    --primary-text: #ffffff;
    --primary-border: #111111;
    --panel-border: 1px solid var(--border);
    --panel-shadow: none;

    --s1: #2a78d6; /* Drew */
    --s2: #eb6834; /* Aaron */
    --s3: #1baf7a; /* Chase */
    --s4: #eda100; /* Zach */
    --s5: #e87ba4; /* Nathan */

    --good: #0ca30c;
    --good-text: #006300;
    --warning: #fab219;
    --serious: #ec835a;
    --critical: #d03b3b;
  }
  /* Dark: logo navy, white/grey text */
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0b1e3d;
    --surface: #10264b;
    --surface-2: #17305a;
    --text-primary: #ffffff;
    --text-secondary: #c8d1e0;
    --text-muted: #8c9ab3;
    --grid: #1f3a66;
    --baseline: #2c4a7a;
    --border: rgba(255,255,255,0.12);
    --accent: #7cc4ea;
    --book: #5cc2f2;
    --actual: #b99bff;

    --topbar-bg: #081830;
    --topbar-text: #ffffff;
    --topbar-tab: #9aa8c0;
    --topbar-line: #1f3a66;
    --tab-active: #ffffff;
    --badge-bg: rgba(255,255,255,0.10);
    --login-bg: #0b1e3d;
    --primary-bg: #ffffff;
    --primary-text: #0b1e3d;
    --primary-border: #ffffff;

    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181;
    --good-text: #3fd13f;
  }
  /* Blackout: a traditional dark mode — near-black greys, white text */
  :root[data-theme="blackout"] {
    color-scheme: dark;
    --page: #121212;
    --surface: #1c1c1c;
    --surface-2: #262626;
    --text-primary: #ececec;
    --text-secondary: #b3b3b3;
    --text-muted: #7c7c7c;
    --grid: #2c2c2c;
    --baseline: #3a3a3a;
    --border: rgba(255,255,255,0.10);
    --accent: #4fb3e8;
    --book: #4fb3e8;
    --actual: #b39dff;

    --topbar-bg: #181818;
    --topbar-text: #ececec;
    --topbar-tab: #8f8f8f;
    --topbar-line: #2c2c2c;
    --tab-active: #4fb3e8;
    --badge-bg: rgba(255,255,255,0.08);
    --login-bg: #121212;
    --primary-bg: #1596d1;
    --primary-text: #ffffff;
    --primary-border: #1596d1;

    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181;
    --good-text: #3fd13f;
  }
  /* Terminal: jet black + neon green, nothing else */
  :root[data-theme="terminal"] {
    color-scheme: dark;
    --brand-navy: #000000; --brand-blue: #00ff41; --brand-gold: #00ff41;
    --page: #000000;
    --surface: #000000;
    --surface-2: #02150a;
    --text-primary: #00ff41;
    --text-secondary: #00cc34;
    --text-muted: #008f24;
    --grid: #063d16;
    --baseline: #0b5c22;
    --border: rgba(0,255,65,0.35);
    --accent: #00ff41;
    --book: #00ff41;
    --actual: #00ff41;

    --topbar-bg: #000000;
    --topbar-text: #00ff41;
    --topbar-tab: #00a82b;
    --topbar-line: #00ff41;
    --tab-active: #00ff41;
    --badge-bg: #02150a;
    --login-bg: #000000;
    --primary-bg: #00ff41;
    --primary-text: #000000;
    --primary-border: #00ff41;
    --panel-border: 1px solid #00ff41;
    --panel-shadow: 0 0 10px rgba(0,255,65,0.25);

    --s1: #00ff41; --s2: #00ff41; --s3: #00ff41; --s4: #00ff41; --s5: #00ff41;
    --good: #00ff41; --good-text: #00ff41; --warning: #00ff41; --serious: #00ff41; --critical: #00ff41;
  }
  /* 8-bit: NES/SNES — sky-blue overworld, chunky black outlines, coin yellow, square pixels */
  :root[data-theme="8bit"] {
    color-scheme: light;
    --page: #5c94fc;
    --surface: #fcfcfc;
    --surface-2: #fce0a8;
    --text-primary: #000000;
    --text-secondary: #3c3c3c;
    --text-muted: #6b6b6b;
    --grid: #bcbcbc;
    --baseline: #7c7c7c;
    --border: #000000;
    --accent: #0058f8;
    --book: #0058f8;
    --actual: #6844fc;

    --topbar-bg: #000000;
    --topbar-text: #fcfcfc;
    --topbar-tab: #bcbcbc;
    --topbar-line: #000000;
    --tab-active: #fcbc3c;
    --badge-bg: #c84c0c;
    --login-bg: #5c94fc;
    --primary-bg: #fcbc3c;
    --primary-text: #000000;
    --primary-border: #000000;
    --panel-border: 4px solid #000000;
    --panel-shadow: 6px 6px 0 #000000;

    --good: #00a800; --good-text: #006800; --warning: #fcbc3c; --serious: #f87858; --critical: #d82800;
  }
  /* Retro: logo sky blues + yellows, navy outlines (like the wordmark) */
  :root[data-theme="retro"] {
    color-scheme: light;
    --page: #8ed3f3;
    --surface: #fffdf2;
    --surface-2: #fff2a8;
    --text-primary: #0b1e3d;
    --text-secondary: #1f3d6b;
    --text-muted: #4b6894;
    --grid: #bfe3f5;
    --baseline: #7fbfe0;
    --border: #0b1e3d;
    --accent: #0b1e3d;
    --book: #0b6fb0;
    --actual: #6a2fc9;

    --topbar-bg: #1596d1;
    --topbar-text: #ffffff;
    --topbar-tab: #e3f5fd;
    --topbar-line: #0b1e3d;
    --tab-active: #ffcc00;
    --badge-bg: #0b1e3d;
    --login-bg: #1596d1;
    --primary-bg: #ffcc00;
    --primary-text: #0b1e3d;
    --primary-border: #0b1e3d;
    --panel-border: 2px solid #0b1e3d;
    --panel-shadow: 4px 4px 0 #0b1e3d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  #app { min-height: 100vh; display: flex; flex-direction: column; }

  /* ---------- shared bits ---------- */
  .brand-row { display: flex; align-items: center; gap: 10px; }
  .bolt { width: 24px; height: 24px; flex: none; color: var(--brand-gold); }
  button { font-family: inherit; cursor: pointer; }

  .btn {
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-primary);
    padding: 9px 14px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
  }
  .btn:hover { background: var(--surface-2); }
  .btn.primary { background: var(--primary-bg); border-color: var(--primary-border); color: var(--primary-text); }
  .btn.primary:hover { filter: brightness(0.92); }
  .btn.ghost { background: transparent; border-color: transparent; color: var(--text-secondary); }
  .btn.small { padding: 6px 10px; font-size: 12px; }
  .btn.danger-outline { border-color: color-mix(in srgb, var(--critical) 50%, transparent); color: var(--critical); background: transparent; }

  /* ---------- LOGIN ---------- */
  .login-screen {
    flex: 1; display: flex; align-items: center; justify-content: center;
    background: var(--login-bg);
  }
  .login-card {
    background: var(--surface); border: var(--panel-border);
    border-radius: 16px;
    padding: 32px 30px 26px;
    width: 320px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
  }
  .login-card .brand-row { justify-content: center; margin-bottom: 4px; }
  .login-card h1 { font-size: 15px; margin: 2px 0 18px; color: var(--text-secondary); font-weight: 600; }
  .pin-dots { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; }
  .pin-dot { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--baseline); }
  .pin-dot.filled { background: var(--brand-blue); border-color: var(--brand-blue); }
  .pin-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .pin-key {
    aspect-ratio: 1; border-radius: 50%; border: 1px solid var(--border);
    background: var(--surface-2); font-size: 18px; font-weight: 600; color: var(--text-primary);
  }
  .pin-key:hover { background: var(--grid); }
  .pin-key.func { font-size: 12px; color: var(--text-muted); background: transparent; border-color: transparent; }
  .login-error { color: var(--critical); font-size: 12px; margin-top: 12px; min-height: 16px; }
  .login-hint { color: var(--text-muted); font-size: 11px; margin-top: 16px; line-height: 1.5; }

  /* ---------- POSITION PICKER ---------- */
  .position-screen {
    flex: 1; display: flex; align-items: center; justify-content: center;
    background: var(--page);
  }
  .position-card { text-align: center; width: 380px; }
  .position-card h1 { font-size: 20px; margin-bottom: 2px; }
  .position-card .sub { color: var(--text-secondary); font-size: 13.5px; margin-bottom: 22px; }
  .position-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .position-btn {
    padding: 22px 10px; border-radius: 12px; border: 1.5px solid var(--border);
    background: var(--surface); font-size: 14.5px; font-weight: 700; color: var(--text-primary);
  }
  .position-btn:hover { border-color: var(--brand-blue); background: color-mix(in srgb, var(--brand-blue) 6%, var(--surface)); }
  .position-btn .goal { display: block; font-size: 11.5px; font-weight: 400; color: var(--text-muted); margin-top: 4px; }

  /* ---------- APP SHELL ---------- */
  .topbar {
    background: var(--topbar-bg); border-bottom: 1px solid var(--topbar-line);
    color: var(--topbar-text); padding: 0 20px; display: flex; align-items: center; justify-content: space-between; height: 56px;
  }
  .topbar .tabs { display: flex; gap: 4px; height: 100%; }
  .topbar .tab {
    background: transparent; border: none; color: var(--topbar-tab); font-size: 13px; font-weight: 600;
    padding: 0 14px; height: 100%; border-bottom: 3px solid transparent;
  }
  .topbar .tab.active { color: var(--topbar-text); border-bottom-color: var(--tab-active); }
  .topbar .tab:hover { color: var(--topbar-text); }
  .who { display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--topbar-text); }
  .who .logout-btn { color: var(--topbar-text); }
  .who .avatar { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #fff; }
  .who .pos-badge { background: var(--badge-bg); padding: 2px 8px; border-radius: 999px; font-size: 11px; border: none; color: var(--topbar-text); font-family: inherit; }
  .who .pos-badge.clickable { cursor: pointer; }
  .who .pos-badge.clickable:hover { filter: brightness(1.15); }
  :root[data-theme="retro"] .who .pos-badge { color: #ffffff; }
  :root[data-theme="retro"] .login-card { box-shadow: 6px 6px 0 #0b1e3d; }
  /* Dark: status text in its own bright color (the light-theme versions are darkened for white backgrounds) */
  :root:is([data-theme="dark"],[data-theme="blackout"]) .ticket-status.progress,
  :root:is([data-theme="dark"],[data-theme="blackout"]) .ticket-status.needs_called { color: var(--warning); }
  :root:is([data-theme="dark"],[data-theme="blackout"]) .ticket-status.backburner,
  :root:is([data-theme="dark"],[data-theme="blackout"]) .status-chip.serious { color: var(--serious); }
  :root:is([data-theme="dark"],[data-theme="blackout"]) .timer-display.logged-warning { color: var(--warning); }

  /* 8-bit: pixel fonts, no rounded corners, hard shadows, brick ground along the bottom */
  :root[data-theme="8bit"] body { font-family: "Pixelify Sans", "Courier New", monospace; font-size: 15px; padding-bottom: 32px; }
  /* brick "ground" pinned along the bottom of the window */
  :root[data-theme="8bit"] body::after {
    content: ""; position: fixed; left: 0; right: 0; bottom: 0; height: 24px; z-index: 50; pointer-events: none;
    border-top: 3px solid #000;
    background-color: #c84c0c;
    background-image:
      repeating-linear-gradient(0deg, transparent 0 10px, #000 10px 12px),
      repeating-linear-gradient(90deg, transparent 0 22px, #000 22px 24px);
  }
  :root[data-theme="8bit"] *, :root[data-theme="8bit"] *::before { border-radius: 0 !important; }
  :root[data-theme="8bit"] :is(.panel h2, .topbar .tab, .meter-title, .setting-label, .login-card h1, .booktime-stacked-heading, .trow.thead, .refresh-btn, .pos-badge) {
    font-family: "Press Start 2P", monospace; letter-spacing: 0; font-weight: 400;
  }
  :root[data-theme="8bit"] .panel h2 { font-size: 12px; line-height: 1.6; }
  :root[data-theme="8bit"] .topbar .tab { font-size: 10px; }
  :root[data-theme="8bit"] .meter-title { font-size: 9px; }
  :root[data-theme="8bit"] .trow.thead { font-size: 7.5px; white-space: nowrap; }
  :root[data-theme="8bit"] .refresh-btn, :root[data-theme="8bit"] .pos-badge { font-size: 9px; color: #fcfcfc; }
  :root[data-theme="8bit"] .meter-value { font-family: "Press Start 2P", monospace; font-size: 15px; }
  :root[data-theme="8bit"] :is(.btn, .icon-btn, .pin-key, .device-chip, .theme-toggle-btn, select, input, textarea) {
    border: 2px solid #000 !important; box-shadow: 2px 2px 0 #000;
  }
  :root[data-theme="8bit"] .btn:active, :root[data-theme="8bit"] .icon-btn:active { transform: translate(2px, 2px); box-shadow: none; }
  :root[data-theme="8bit"] .meter-track { height: 14px; border: 2px solid #000; background: #fcfcfc; }
  :root[data-theme="8bit"] .meter-fill { background-image: repeating-linear-gradient(90deg, transparent 0 8px, rgba(0,0,0,.18) 8px 10px); }
  :root[data-theme="8bit"] .device-chip { background: #fcbc3c; color: #000; }
  :root[data-theme="8bit"] .ticket-status, :root[data-theme="8bit"] .due-pill, :root[data-theme="8bit"] .status-chip { border: 2px solid #000; }
  :root[data-theme="8bit"] .due-pill { font-size: 11px; padding: 1px 6px; }
  :root[data-theme="8bit"] .login-card { border: 4px solid #000; box-shadow: 8px 8px 0 #000; }
  :root[data-theme="8bit"] .bolt { color: #fcbc3c !important; filter: drop-shadow(2px 2px 0 #000); }
  :root[data-theme="8bit"] .avatar { outline: 2px solid #000; }

  /* Terminal: force every colored element to black/green. Book-time verdicts stay distinguishable:
     under = plain green, slightly over = dim green box, way over = inverted (black on green). */
  :root[data-theme="terminal"] body { font-family: "Cascadia Mono", Consolas, "Courier New", ui-monospace, monospace; text-shadow: 0 0 3px rgba(0,255,65,0.45); }
  :root[data-theme="terminal"] :is(.ticket-status, .status-chip, .work-outcome-badge, .diag-badge, .device-chip, .pos-badge) {
    background: #000 !important; color: #00ff41 !important; border: 1px solid #00ff41 !important;
  }
  :root[data-theme="terminal"] .avatar { background: #00ff41 !important; color: #000 !important; text-shadow: none; }
  :root[data-theme="terminal"] :is(select, input, textarea) { background: #000; color: #00ff41; border-color: #00ff41 !important; font-family: inherit; }
  :root[data-theme="terminal"] .btn.primary, :root[data-theme="terminal"] .toast { text-shadow: none; }
  :root[data-theme="terminal"] .toast { background: #00ff41; color: #000; }
  :root[data-theme="terminal"] .toast.error { background: #000; color: #00ff41; border: 1px solid #00ff41; }
  :root[data-theme="terminal"] .rs-warning { background: #000; border-color: #00ff41; }
  :root[data-theme="terminal"] .icon-btn { background: #000; border-color: #00ff41; color: #00ff41; }
  :root[data-theme="terminal"] :is(.icon-btn, .admin-menu-icon, .queue-caret) { filter: grayscale(1) sepia(1) hue-rotate(70deg) saturate(8) brightness(1.1); }
  :root[data-theme="terminal"] .timer-display.logged-good { background: transparent; color: #00ff41; }
  :root[data-theme="terminal"] .timer-display.logged-warning { background: #063d16; color: #00ff41; }
  :root[data-theme="terminal"] .timer-display.logged-critical { background: #00ff41; color: #000; text-shadow: none; }
  :root[data-theme="terminal"] .meter-pace { background: #00ff41; }
  :root[data-theme="terminal"] .pin-key { background: #000; border-color: #00ff41; color: #00ff41; }
  :root[data-theme="terminal"] .login-card { box-shadow: 0 0 24px rgba(0,255,65,0.35); }
  :root[data-theme="terminal"] .bolt { color: #00ff41 !important; }
  :root[data-theme="retro"] .topbar .tab { text-shadow: 0 1px 0 rgba(11,30,61,0.35); }
  .pos-switcher { position: relative; }
  .pos-menu {
    position: absolute; top: calc(100% + 6px); left: 0; z-index: 20;
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2); min-width: 140px; overflow: hidden;
  }
  .pos-menu-item {
    display: block; width: 100%; text-align: left; padding: 9px 12px; border: none; background: transparent;
    font-size: 12.5px; color: var(--text-primary); border-bottom: 1px solid var(--grid);
  }
  .pos-menu-item:last-child { border-bottom: none; }
  .pos-menu-item:hover { background: var(--surface-2); }
  .pos-menu-item.current { font-weight: 700; color: var(--brand-blue); }

  main.content { flex: 1; max-width: 1480px; width: 100%; margin: 0 auto; padding: 22px 24px 40px; }

  .proto-banner {
    background: color-mix(in srgb, var(--warning) 18%, var(--surface));
    border: 1px solid color-mix(in srgb, var(--warning) 45%, transparent);
    font-size: 12.5px; padding: 9px 13px; border-radius: 8px; margin-bottom: 18px;
  }

  /* ---------- GOAL METERS ---------- */
  .meters-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 20px; }
  .meter-card { background: var(--surface); border: var(--panel-border); box-shadow: var(--panel-shadow); border-radius: 10px; padding: 16px 18px; }
  .meter-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .meter-title { font-size: 12.5px; color: var(--text-secondary); font-weight: 600; }
  .meter-value { font-size: 20px; font-weight: 700; }
  .meter-value .of { font-size: 13px; color: var(--text-muted); font-weight: 400; }
  .meter-track { position: relative; height: 10px; background: var(--grid); border-radius: 6px; overflow: visible; margin-bottom: 8px; }
  .meter-fill { position: absolute; top: 0; left: 0; height: 100%; border-radius: 6px; background: var(--brand-blue); }
  .meter-pace { position: absolute; top: -3px; width: 2px; height: 16px; background: var(--text-muted); border-radius: 1px; }
  .status-chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; }
  .status-chip.good { background: color-mix(in srgb, var(--good) 16%, transparent); color: var(--good-text); }
  .status-chip.serious { background: color-mix(in srgb, var(--serious) 20%, transparent); color: color-mix(in srgb, var(--serious) 70%, black); }
  .meter-note { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

  /* ---------- TICKET LIST ---------- */
  .panel { background: var(--surface); border: var(--panel-border); box-shadow: var(--panel-shadow); border-radius: 10px; padding: 16px 18px; margin-bottom: 16px; }
  .panel h2 { font-size: 13.5px; font-weight: 600; margin: 0 0 12px 0; }
  .ticket-row {
    display: flex; align-items: center; gap: 12px; padding: 12px 4px; border-bottom: 1px solid var(--grid);
  }
  .ticket-row:last-child { border-bottom: none; }
  .ticket-main { flex: 1; min-width: 0; }
  a.ticket-main { display: block; text-decoration: none; color: inherit; border-radius: 6px; margin: -4px; padding: 4px; }
  a.ticket-main:hover { background: var(--surface-2); }
  a.ticket-main:hover .ticket-subject { text-decoration: underline; }

  .money-who-amt { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }

  .assign-select-wrap { display: flex; align-items: center; gap: 6px; }

  .setting-select { font: inherit; font-size: 13px; padding: 6px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text-primary); max-width: 100%; cursor: pointer; }

  .theme-toggle { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .theme-toggle-btn { border: 1.5px solid var(--border); background: var(--surface-2); color: var(--text-secondary); padding: 8px 14px; border-radius: 8px; font-size: 12.5px; font-weight: 600; }

  @media (max-width: 760px) {
    .meters-row, .admin-grid { grid-template-columns: 1fr; }
  }

  /* ---------- real-app additions ---------- */
  /* One compact line per ticket: ticket | status | type/model/repair | book | timer | note/time | outcome */
  .trow {
    display: grid; align-items: center; column-gap: 10px;
    grid-template-columns: minmax(180px, 1.3fr) 92px 118px minmax(400px, 2.4fr) 56px 150px 50px minmax(170px, 1fr);
    padding: 5px 4px; border-bottom: 1px solid var(--grid); min-height: 44px;
  }
  .trow:last-child { border-bottom: none; }

  .icon-btn.on { border-color: var(--brand-blue); background: color-mix(in srgb, var(--brand-blue) 14%, var(--surface)); }
  .refurb-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 8px; }

  .refurb-chip b { color: var(--book); font-weight: 700; }

  .diag-actions .tcell-device { width: 420px; }

  /* 📖 book = blue, ⏱ actual = purple — same in the top bars, column headers and every number */
  .tcell-book { color: var(--book); }

<body>
<div id="app"></div>
<div id="toast-root"></div>
<script>
/* ============ CONFIG ============ */
let RS_SUBDOMAIN = "lightningrepair"; // overwritten by the server's value on load
function rsTicketUrl(internalId) { return `https://${RS_SUBDOMAIN}.repairshopr.com/tickets/${internalId}`; }

let POSITIONS = ["Technician", "Float", "Sales", "Assistant Manager", "Manager"];
// Daily goals per position, in seconds (null = no goal). Set by the admin (Admin Console → Daily goals); comes from the server.
let GOALS = {
  "Technician": { book: 6*3600, spent: 6*3600 },
  "Float":      { book: 4*3600, spent: 4*3600 },
  "Sales":      null,
  "Assistant Manager": { book: 2*3600, spent: 2*3600 },
  "Manager":    null,
};
const WORKDAY_START = 9, WORKDAY_END = 18; // 9a-6p, for the "on pace" tick
const POLL_MS = 15000; // server re-pulls RepairShopr once its copy is 20s old

const OUTCOME_LABELS = {
  diagnosis_completed: "Completed Diagnosis",
  repair_completed: "Completed Repair",
  diagnosis_incomplete: "Did Not Complete Diagnosis",
  repair_incomplete: "Did Not Complete Repair",
};

// RepairShopr "Issue Type" → Book Time Database category/subtype. Mirrors lib/booktime.mjs on the server.
// "alt" = other sub-types whose models are also offered (RS has no Handheld type, so Switch/Gameboy
// models are listed under Game Console).
const ISSUE_TYPE_TO_DEVICE = {
  "Phone": { category: "mobile", subtype: "phone" },
  "Tablet": { category: "mobile", subtype: "tablet" },
  "Smart Watch": { category: "mobile", subtype: "watch" },
  "Laptop": { category: "computer", subtype: "moduleLaptops" },
  "Desktop": { category: "computer", subtype: "desktop" },
  "All-in-One": { category: "computer", subtype: "allInOne" },
  "Game Console": { category: "gaming", subtype: "console", alt: ["handheld"] },
  "Game Controller": { category: "gaming", subtype: "controller" },
  "Service/Consult": { category: "misc", subtype: "misc" },
  "Other/Misc": { category: "misc", subtype: "misc" },
};
// The only Issue Types RepairShopr offers — the Type dropdown never shows anything else.
const RS_ISSUE_TYPES = Object.keys(ISSUE_TYPE_TO_DEVICE);
const ISSUE_TYPE_ICONS = {
  "Phone": "📱", "Tablet": "📱", "Smart Watch": "⌚", "Laptop": "💻", "Desktop": "🖥️", "All-in-One": "🖥️",
  "Game Console": "🎮", "Game Controller": "🕹️", "Service/Consult": "🔧", "Other/Misc": "🔧",
};
const CATEGORY_ORDER = ["mobile", "computer", "gaming", "misc"];
const STACK_ORDER_BY_CATEGORY = {
  mobile:   ["phone", "tablet", "watch"],
  computer: ["moduleLaptops", "desktop", "allInOne"],
  gaming:   ["handheld", "console", "controller"],
  misc:     ["misc"],
};

const THEMES = [
  { key: "retro",    label: "⚡ Default" },
  { key: "dark",     label: "🌙 Dark" },
  { key: "blackout", label: "◼ Blackout" },
  { key: "8bit",     label: "👾 8-bit" },
  { key: "terminal", label: ">_ Terminal" },
];

/* ============ small helpers ============ */
// Escape anything that came from RepairShopr / users before putting it in HTML.
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
// A string safely embedded as a JS argument inside an onclick="..." attribute.
function jsArg(s) { return esc(JSON.stringify(s == null ? null : String(s))); }
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} },
};
function nowMs() { return Date.now() + (state.clockOffset || 0); }
function firstName(personId) { const p = PEOPLE[personId]; return p ? p.name.split(" ")[0] : "Someone"; }

/* ============ STATE ============ */
let PEOPLE = {}; // id -> person (filled from the server)
let state = {
  screen: "loading",     // loading | login | position | app
  pin: "",
  loginError: "",
  loggingIn: false,
  token: store.get("lr_token"),
  me: null,
  currentUser: null,
  position: null,
  attendance: {},         // personId -> position they're working today (= who's "logged in today")
  tab: "day",             // day | team | admin | settings
  theme: THEMES.some(t => t.key === store.get("lr_theme")) ? store.get("lr_theme") : "retro", // Retro is the default
  today: null,
  clockOffset: 0,
  tickets: [],
  personToday: {},
  rsError: null,
  rsUsers: [],
  noteOpen: null,
  noteDrafts: {},
  manualOpen: null,
  manualDrafts: {},
  manualConfirm: {},
  structDrafts: {},
  typeEditOpen: null,
  dueEditOpen: null,       // ticket whose due-date popup is open
  dueCustom: "",
  sortMode: "default",     // My Day order: default | reverse | oldest | newest
  diagStep: {},            // ticket id → "repair" once "diagnosis 100% completed?" was answered Yes
  diagMinRepairTotal: 119,
  manualTimeNote: false,
  showMoney: true,
  showTeamBook: false,
  refreshing: false,
  creditEditOpen: null,
  actualEditOpen: null,
  keyDrafts: {},           // Admin → Users: pasted API keys (never shown back once saved)
  defaultKeyDraft: "",
  keysInfo: null,    // ticket whose ⏱ actual time is being typed in
  actualDraft: "",    // completed ticket whose credit editor is open
  creditDraft: [],      // ticket id whose Type chip is currently showing its dropdown        // Book Time Database "add model / add repair type" inputs
  outcomeEditOpen: null,    // ticket id currently showing its outcome dropdown in "Tickets I worked on today"
  bookTimeCategories: {},
  overBookThresholdPct: 15,
  diagnosisEligibleStatuses: [],
  queueStatuses: [],
  adminSection: null,    // null (menu) | users | booktime | rs | reports
  adminView: "home",     // within the booktime section: home | category
  adminCategory: null,   // mobile | computer | gaming
  expandedGroups: new Set(), // Team tab queue groups start collapsed
  positionMenuOpen: false,
  pinDrafts: {},
  newPersonName: "",
  rsCheck: null,
  rsCheckLoading: false,
};

/* ============ API ============ */
let lastMutationStartedAt = 0;
async function api(path, body) {
  const opts = { method: body === undefined ? "GET" : "POST", headers: {} };
  if (state.token) opts.headers.Authorization = "Bearer " + state.token;
  if (body !== undefined) { opts.headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(body); }
  // Never hang forever: give up after 20s with a clear message.
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 20000);
  opts.signal = ctrl.signal;
  let res;
  try { res = await fetch("/api" + path, opts); }
  catch (e) {
    throw new Error(e.name === "AbortError" ? "The server took too long to answer — try again in a minute" : "Can't reach the server — check your internet connection");
  } finally { clearTimeout(timer); }
  let data = null;
  try { data = await res.json(); } catch (e) {}
  if (res.status === 401 && path !== "/login") { logout(true); throw new Error("Session expired — log in again"); }
  if (!res.ok) throw new Error((data && data.error) || (res.status === 502 || res.status === 504
    ? "The server timed out — try again in a minute"
    : `Server error (${res.status})`));
  return data;
}

// Optimistic update → server call → reload real state. On failure, show why and reload (reverting).
async function mutate(path, body, optimistic) {
  lastMutationStartedAt = performance.now();
  if (optimistic) { optimistic(); render(); }
  try {
    const r = await api(path, body);
    await loadState();
    return r;
  } catch (e) {
    showToast(e.message, "error");
    loadState().catch(() => {});
    return null;
  }
}

let loading = null;
async function loadState(force) {
  const startedAt = performance.now();
  const p = api(force ? "/state?refresh=1" : "/state");
  loading = p;
  const data = await p;
  if (startedAt < lastMutationStartedAt) return; // a newer change is in flight — its own reload will land
  applyServerState(data);
  if (safeToRerender()) render(); else pendingRender = true;
}

// ⟳ Refresh: pull from RepairShopr now instead of waiting for the next automatic check.
async function refreshNow() {
  if (state.refreshing) return;
  state.refreshing = true; render();
  try { lastMutationStartedAt = performance.now(); await loadState(true); showToast("Up to date with RepairShopr"); }
  catch (e) { showToast(e.message, "error"); }
  finally { state.refreshing = false; render(); }
}
function applyServerState(d) {
  RS_SUBDOMAIN = d.rsSubdomain || RS_SUBDOMAIN;
  PEOPLE = Object.fromEntries(d.people.map(p => [p.id, { ...p, admin: p.isAdmin }]));
  if (state.me !== d.me) { state.me = d.me; loadSortMode(); }
  state.currentUser = PEOPLE[d.me];
  state.attendance = Object.fromEntries(d.attendance.map(a => [a.personId, a.position]));
  state.today = d.today;
  state.clockOffset = d.serverNow - Date.now();
  state.bookTimeCategories = d.settings.bookTimes || {};
  if (d.settings.positions) POSITIONS = d.settings.positions;
  if (d.settings.roleGoals) GOALS = Object.fromEntries(Object.entries(d.settings.roleGoals).map(([p, g]) => [p, g ? { book: g.book * 60, spent: g.actual * 60 } : null]));
  state.overBookThresholdPct = d.settings.overBookThresholdPct;
  state.diagnosisEligibleStatuses = d.settings.diagnosisEligibleStatuses || [];
  state.diagMinRepairTotal = d.settings.diagMinRepairTotal ?? 119;
  state.manualTimeNote = !!d.settings.manualTimeNote;
  state.showMoney = d.settings.showMoney !== false;
  state.showTeamBook = d.settings.showTeamBook === true;
  state.queueStatuses = d.settings.queueStatuses || [];
  state.personToday = d.personToday || {};
  state.rsError = d.rsError;
  state.rsUsers = d.rsUsers || [];
  state.money = d.money || null;
  state.cardReaders = d.cardReaders || [];
  state.refurbs = (d.refurbs || []).map(buildRefurb);
  state.activeToday = d.activeToday || {};
  state.tickets = d.tickets.map(buildTicket);
}

// Server ticket → the shape the UI works with (current user's timer folded in, device resolved).
function buildTicket(t) {
  const mine = (t.timers && t.timers[state.me]) || { state: "idle", runningSince: null, totalSec: 0, todaySec: 0 };
  const x = {
    ...t,
    timerState: mine.state,
    runningSince: mine.state === "running" ? mine.runningSince : null,
    spentSec: mine.totalSec || 0,
  };
  resolveDevice(x);
  recomputeBookedSec(x);
  return x;
}
// Category comes from RepairShopr's Issue Type; the picked model can switch to an "alt" sub-type.
function resolveDevice(t) {
  const mapped = t.issueType ? ISSUE_TYPE_TO_DEVICE[t.issueType] : null;
  if (!mapped) { t.deviceCategory = null; t.deviceSubtype = null; return; }
  t.deviceCategory = mapped.category;
  t.deviceSubtype = t.deviceOverrideSubtype && (mapped.alt || []).includes(t.deviceOverrideSubtype) ? t.deviceOverrideSubtype : mapped.subtype;
}

/* ============ book-time math (mirrors lib/booktime.mjs) ============ */
function deviceGridFor(t) {
  if (!t.deviceCategory || !t.deviceSubtype) return null;
  const cat = state.bookTimeCategories[t.deviceCategory];
  return (cat && cat.subtypes[t.deviceSubtype]) || null;
}
function diagnosticsMinutesFor(t) {
  const grid = deviceGridFor(t);
  if (!grid) return null;
  const row = (t.deviceRow && grid.data[t.deviceRow]) ? grid.data[t.deviceRow] : (grid.rows.length ? grid.data[grid.rows[0]] : null);
  return row ? (row["Diagnostics"] ?? null) : null;
}
function repairColumnsFor(t) {
  const grid = deviceGridFor(t);
  if (!grid || !t.deviceRow || !grid.data[t.deviceRow]) return [];
  return grid.columns.filter(c => c !== "Diagnostics" && grid.data[t.deviceRow][c] != null);
}
function repairMinutesFor(t, repairType) {
  const grid = deviceGridFor(t);
  if (!grid || !t.deviceRow || !repairType || !grid.data[t.deviceRow]) return null;
  return grid.data[t.deviceRow][repairType] ?? null;
}
// A ticket's book time = the picked repair type's minutes. Until a repair type is picked, it's the
// Diagnostics minutes. (Never the two added together — they're credited separately.)
function recomputeBookedSec(t) {
  const min = t.repairType ? (repairMinutesFor(t, t.repairType) || 0) : (diagnosticsMinutesFor(t) || 0);
  t.bookedSec = min * 60;
}

/* ============ formatting ============ */
function fmtClock(sec) {
  sec = Math.max(0, sec);
  const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = Math.floor(sec%60);

}

  if (!bookedSec) return { tier: "good", icon: "✓", tooltip: "" };
  const thresholdSec = bookedSec * (1 + state.overBookThresholdPct / 100);
  const pct = Math.round(((spentSec - bookedSec) / bookedSec) * 100);
  if (spentSec <= bookedSec) {
    return { tier: "good", icon: "✓", tooltip: `${fmtHM(spentSec)} logged — ${fmtHM(bookedSec - spentSec)} under the ${fmtHM(bookedSec)} book-time standard` };
  }
  if (spentSec <= thresholdSec) {
    return { tier: "warning", icon: "⚠", tooltip: `${fmtHM(spentSec)} logged — ${pct}% over the ${fmtHM(bookedSec)} book-time standard (within the ${state.overBookThresholdPct}% warn range)` };

/* ============ RENDER ============ */
// Inputs that keep their value in state (oninput → draft) carry data-draft="1" and survive re-renders.
// Any OTHER focused input (e.g. a Book Time cell mid-edit) or an open <select> blocks background re-renders.
let pendingRender = false;
function safeToRerender() {
  const a = document.activeElement;
  if (!a) return true;
  if (a.tagName === "SELECT") return false;
  if ((a.tagName === "INPUT" || a.tagName === "TEXTAREA") && a.dataset.draft !== "1") return false;
  return true;
}
function render() {
  pendingRender = false;
  const active = document.activeElement;
  const canPreserve = active && (active.tagName === "TEXTAREA" || active.tagName === "INPUT" || active.tagName === "SELECT") && active.id;
  const savedId = canPreserve ? active.id : null;
  const savedStart = canPreserve && typeof active.selectionStart === "number" ? active.selectionStart : null;
  const savedEnd = canPreserve && typeof active.selectionEnd === "number" ? active.selectionEnd : null;

  const app = document.getElementById("app");
  if (state.screen === "loading") app.innerHTML = `<div class="loading-screen">Loading…</div>`;
  else if (state.screen === "login") app.innerHTML = renderLogin();
  else if (state.screen === "position") app.innerHTML = renderPosition();
  else app.innerHTML = renderApp();

  if (savedId) {
    const el = document.getElementById(savedId);
    if (el) {
      el.focus();
      if (savedStart !== null && el.setSelectionRange) {
        try { el.setSelectionRange(savedStart, savedEnd); } catch (e) {}
      }
    }
  }
}
// 1s tick for live timers (only on screens that show them).
setInterval(() => {
  if (state.screen !== "app") return;
  if (!(state.tab === "day" || state.tab === "team") && !pendingRender) return;
  if (!safeToRerender()) return;
  render();
}, 1000);
// Background refresh so the team view / RS tickets stay current.
setInterval(() => {
  if (state.screen !== "app" || document.hidden) return;
  loadState().catch(e => console.warn(e));
  if (state.tab === "reports") loadReportLive();
}, POLL_MS);
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && state.screen === "app") loadState().catch(() => {});
});
document.addEventListener("focusout", () => {
  setTimeout(() => { if (pendingRender && safeToRerender()) render(); }, 0);
});

async function tryLogin() {

/* ============ ROUTING (browser back/forward) ============ */
function routeFromState() {
  if (state.tab === "admin") {
    if (!state.adminSection) return "#/admin";
    if (state.adminSection === "booktime" && state.adminCategory) return `#/admin/booktime/${state.adminCategory}`;
    return `#/admin/${state.adminSection}`;
  }
  if (state.tab === "apps") return state.appOpen ? `#/apps/${state.appOpen}` : "#/apps";
  return "#/" + state.tab;
}
function applyRoute() {
  const parts = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean);
  if (parts[0] === "cards") { parts.splice(0, 1, "apps", "cards"); }   // old link → LR Apps › card report
  let tab = parts[0] || "day";
  if (!["day", "team", "apps", "settings", "reports", "admin"].includes(tab)) tab = "day";
  const app = tab === "apps" && parts[1] ? LR_APPS.find(a => a.key === parts[1]) : null;
  state.appOpen = app && app.can() ? app.key : null;
  if (state.appOpen) setTimeout(app.open, 0);
  if ((tab === "admin" || tab === "reports") && !(state.currentUser && state.currentUser.admin)) tab = "day";
  if (tab === "reports") setTimeout(loadReportLive, 0);
  state.tab = tab;
  state.adminSection = tab === "admin" ? (parts[1] || null) : null;
  state.adminCategory = tab === "admin" && parts[1] === "booktime" ? (parts[2] || null) : null;
  state.adminView = state.adminCategory ? "category" : "home";
  state.positionMenuOpen = false;
  if (state.adminSection === "rs" && !state.rsCheck && !state.rsCheckLoading) setTimeout(runRsCheck, 0);
  if (state.adminSection === "rs") setTimeout(loadKeysInfo, 0);
  if (!location.hash || location.hash !== routeFromState()) history.replaceState(null, "", routeFromState()); // bounced → fix the address bar
}
function navigate() {
  const h = routeFromState();
  if (location.hash !== h) location.hash = h; // hashchange → applyRoute + render
  else render();
}
window.addEventListener("hashchange", () => {
  if (state.screen !== "app") return;
  applyRoute();
  render();
});

/* ---------- My Day ---------- */
// Open tickets assigned to someone (resolved ones live under "completed" instead).
function ticketsFor(userId) { return state.tickets.filter(t => t.assignedTo === userId && !t.notOpen && t.status !== "Resolved"); }
function findTicket(id) { return id < 0 ? findRefurb(id) : state.tickets.find(x => x.id === id); }
// "Your assigned tickets" on My Day: only tickets in an "in the queue" status. A ticket whose timer
// you have running/paused stays visible even if its status moved on, so you can always stop it.
const normStatus = s => String(s || "").trim().toLowerCase();
function isQueueStatus(status) { return state.queueStatuses.some(q => normStatus(q) === normStatus(status)); }
const SORT_MODES = [
  { key: "default",  label: "Default — due date, then device type, then oldest" },
  { key: "reverse",  label: "Reverse default — top priority at the bottom" },
  { key: "oldest",   label: "Ticket age — oldest at the top" },
  { key: "newest",   label: "Ticket age — newest at the top" },
];
const createdMs = t => (t.createdAt ? Date.parse(t.createdAt) : Infinity);
function myQueueTickets(userId) {
  return sortQueue(ticketsFor(userId).filter(t => isQueueStatus(t.status) || t.timerState === "running" || t.timerState === "paused"));
}
// Same order everywhere (My Day + Team tab groups), using the viewer's "My Day order" setting.
function sortQueue(list) {
  list = list.slice();
  const mode = state.sortMode;
  if (mode === "oldest") return list.sort((a, b) => createdMs(a) - createdMs(b));
  if (mode === "newest") return list.sort((a, b) => createdMs(b) - createdMs(a));
  list.sort(compareQueue);
  return mode === "reverse" ? list.reverse() : list;
}
// Sort choice is per person (remembered on this device).
function loadSortMode() {
  const v = state.me ? store.get("lr_sort_" + state.me) : null;
  state.sortMode = SORT_MODES.some(m => m.key === v) ? v : "default";
}
function setSortMode(mode) {
  state.sortMode = mode;
  if (state.me) store.set("lr_sort_" + state.me, mode);
  render();
}
// My Day order: 1) nearest due DAY first (no due date → last)  2) device type priority
// 3) oldest ticket first (exact created time).
const TYPE_PRIORITY = ["Phone", "Game Console", "Tablet", "Smart Watch", "Laptop", "Desktop", "All-in-One", "Game Controller", "Other/Misc", "Service/Consult"];
function typeRank(t) { const i = TYPE_PRIORITY.indexOf(t.issueType); return i < 0 ? TYPE_PRIORITY.length : i; }
function compareQueue(a, b) {
  const da = a.dueDay || "9999-12-31", db = b.dueDay || "9999-12-31";
  if (da !== db) return da < db ? -1 : 1;
  const ta = typeRank(a), tb = typeRank(b);
  if (ta !== tb) return ta - tb;
  const ca = a.createdAt ? Date.parse(a.createdAt) : Infinity, cb = b.createdAt ? Date.parse(b.createdAt) : Infinity;
  return ca - cb;
}
// Whole days from today (shop time) to the due day: 0 = today, 1 = tomorrow, negative = overdue.
function daysUntil(day) {

  return Math.round((Date.parse(day + "T00:00:00Z") - Date.parse(state.today + "T00:00:00Z")) / 86400000);
}
function addDays(day, n) {

}
function shortDay(day) {

}

// Resolved today with a share of the credit for this person (by default: whoever was assigned when it was resolved).

function computeTotals(userId) {

  const paceFrac = Math.min(1, Math.max(0, (hours - WORKDAY_START) / (WORKDAY_END - WORKDAY_START)));
  const expectedSec = goalSec * paceFrac;
  const diff = actualSec - expectedSec;
  const ahead = diff >= 0;
  const chip = `<span class="status-chip ${ahead ? 'good':'serious'}">${ahead ? '▲ Ahead' : '▼ Behind'} ${fmtHM(Math.abs(diff))}</span>`;
  return `
    <div class="meter-card ${kind || ""}">

        <div class="meter-pace" style="left:${paceFrac*100}%" title="Expected pace right now"></div>

}
function renderCreditBadges(t) {

function hasActedToday(t, userId) { return (t.workLog || []).some(w => w.personId === userId && w.date === state.today); }
function todaysEntry(t, userId) { return (t.workLog || []).find(w => w.personId === userId && w.date === state.today) || null; }

  return state.tickets.filter(t =>
    !t.notOpen &&
    (!t.diagnosisLocked || !t.repairLocked) &&
    isDiagnosisStatus(t) &&
    (t.queuedToday || []).includes(userId) &&

/* ----- diagnosis / repair credit ----- */
function outcomeOptionsFor(t, forceInclude) {
  const diagMin = diagnosticsMinutesFor(t);
  const diagPair = [
    { value: "diagnosis_completed", label: diagMin ? `Claim Completed Diagnosis (${diagMin}m)` : "Claim Completed Diagnosis" },
    { value: "diagnosis_incomplete", label: "Did not complete diagnosis" },
  ];
  const repairMin = t.repairType ? repairMinutesFor(t, t.repairType) : null;
  const repairLabel = t.repairType
    ? `Claim Completed Repair — ${t.repairType}${repairMin ? ` (${repairMin}m)` : ""}`
    : "Claim Completed Repair (pick a repair type for book time)";
  const repairPair = [
    { value: "repair_completed", label: repairLabel },
    { value: "repair_incomplete", label: "Did not complete repair" },
  ];
  const opts = [];
  if (!t.diagnosisLocked || diagPair.some(o => o.value === forceInclude)) opts.push(...diagPair);
  if (!t.repairLocked || repairPair.some(o => o.value === forceInclude)) opts.push(...repairPair);
  return opts;
}
function reverseOutcomeEffects(t, outcome, personId) {
  if (outcome === 'diagnosis_completed' && t.diagnosisClaimedBy === personId) {
    t.diagnosisClaimedBy = null; t.diagnosisClaimedAt = null; t.diagnosisLocked = false;
  } else if (outcome === 'repair_completed' && t.repairClaimedBy === personId) {
    t.repairClaimedBy = null; t.repairClaimedAt = null; t.repairLocked = false;
    if (!t.diagnosisClaimedBy) t.diagnosisLocked = false;
  }
}
function applyOutcomeEffects(t, outcome, personId) {
  if (outcome === 'diagnosis_completed') {
    t.diagnosisClaimedBy = personId; t.diagnosisClaimedAt = state.today; t.diagnosisLocked = true;
  } else if (outcome === 'repair_completed') {
    t.repairClaimedBy = personId; t.repairClaimedAt = state.today; t.repairLocked = true;
    if (!t.diagnosisLocked) t.diagnosisLocked = true;
  }
}
// Single entry point for every outcome dropdown. Replaces whatever this user already logged today
// for the ticket (reversing its effects first), or clears it when newOutcome is blank.
function setOutcome(ticketId, newOutcome) {
  const t = findTicket(ticketId);
  const personId = state.me;
  state.outcomeEditOpen = null;
  mutate("/outcome", { ticketId, outcome: newOutcome || null }, () => {
    const existing = todaysEntry(t, personId);
    if (existing) {
      reverseOutcomeEffects(t, existing.outcome, personId);
      if (!newOutcome) t.workLog = t.workLog.filter(w => w !== existing);
      else { existing.outcome = newOutcome; existing.loggedAt = nowMs(); applyOutcomeEffects(t, newOutcome, personId); }
    } else if (newOutcome) {
      t.workLog = t.workLog || [];
      t.workLog.push({ personId, date: state.today, outcome: newOutcome, loggedAt: nowMs() });
      applyOutcomeEffects(t, newOutcome, personId);
    }
  });
}
function renderOutcomeSelect(t, selectedOutcome, idSuffix) {
  const opts = outcomeOptionsFor(t, selectedOutcome);
  if (!opts.length) return "";
  const placeholder = selectedOutcome
    ? `<option value="">— clear my answer —</option>`
    : `<option value="" disabled selected>Select outcome…</option>`;
  const optionsHtml = opts.map(o =>
    `<option value="${o.value}" ${o.value === selectedOutcome ? "selected" : ""}>${esc(o.label)}</option>`
  ).join("");
  return `<select id="outcome-select-${t.id}${idSuffix || ""}" class="outcome-select" onchange="setOutcome(${t.id}, this.value)">${placeholder}${optionsHtml}</select>`;
}

// Minutes only.
function parseMinutes(raw) {

/* ----- credit (who gets a completed ticket's book time) ----- */
// The PRIMARY owns a completed ticket: it's assigned to them in RepairShopr and only they (or an admin)
// can change how its credit is split. Anyone with a share sees it in their list, read-only.
function creditOwner(t) { return t.completion.primaryPerson || t.completion.assignedPerson || null; }
function canEditCredit(t) { return !!t.completion && (state.currentUser.admin || creditOwner(t) === state.me); }
function fmtMin(m) { const r = Math.round(m * 10) / 10; return `${Number.isInteger(r) ? r : r.toFixed(1)}m`; }

  const label = !sh.length ? "⚠ No one credited"
    : sh.length === 1 ? `👤 ${firstName(sh[0].personId)}`
    : ordered.map(x => `${firstName(x.personId)} ${x.pct}%`).join(" · ");
  const detail = sh.length ? ordered.map(x => `${x.personId === owner ? "(PRIMARY) " : ""}${PEOPLE[x.personId]?.name || x.personId} — ${x.pct}% · ${fmtMin((c.bookMinutes || 0) * x.pct / 100)}`).join("\n") : "";
  return canEditCredit(t)
    ? `<button type="button" class="device-chip clickable credit-chip ${sh.length ? "" : "unset"}" onclick="openCreditEdit(${t.id})" title="${esc(detail ? detail + "\n\nClick to change" : "Click to give credit")}">${esc(label)}</button>`
    : `<span class="device-chip credit-chip" title="${esc(detail + `\n\n${firstName(owner)} is primary — only they can change this`)}">${esc(label)}</span>`;

// Draft rows: row 0 is always the primary; the LAST row always gets whatever's left, so it adds up to 100%.
function openCreditEdit(ticketId) {

  const owner = creditOwner(t);
  const rows = t.completion.shares.map(x => ({ personId: x.personId, pct: String(x.pct) }))
    .sort((a, b) => (b.personId === owner) - (a.personId === owner));
  state.creditDraft = rows.length ? rows : [{ personId: owner || "", pct: "100" }];

function creditRest() {
  const d = state.creditDraft;
  return 100 - d.slice(0, -1).reduce((a, x) => a + (parseInt(x.pct, 10) || 0), 0);
}
function creditPct(i) { const d = state.creditDraft; return i === d.length - 1 ? creditRest() : (parseInt(d[i].pct, 10) || 0); }
function creditProblem() {
  const d = state.creditDraft;
  if (d.some(x => !x.personId)) return "Pick a person for every line";
  if (new Set(d.map(x => x.personId)).size !== d.length) return "Each person can only be listed once";
  if (d.slice(0, -1).some(x => !(parseInt(x.pct, 10) >= 1))) return "Every share needs at least 1%";
  if (creditRest() < 1) return "That's more than 100% — lower someone's share";

}
// Typing only touches the numbers next to it — no re-render, so the cursor never jumps.
function creditPctInput(ticketId, i, el) {
  const clean = el.value.replace(/[^0-9]/g, "").slice(0, 3);

function toggleTimer(id, action) {
  const t = findTicket(id);
  mutate("/timer", { ticketId: id, action }, () => {
    if (action === 'start') {
      // one running timer per person — starting a new one PAUSES the other (never logs it)
      [...state.tickets, ...(state.refurbs || [])].forEach(other => {
        if (other.id !== t.id && other.timerState === 'running') { finalizeElapsed(other); other.timerState = 'paused'; }
      });
      t.timerState = 'running';
      t.runningSince = nowMs();
    }
    if (action === 'pause') { finalizeElapsed(t); t.timerState = 'paused'; }
    if (action === 'stop') { finalizeElapsed(t); t.timerState = 'logged'; }
  });
}

function activePeople() { return Object.values(PEOPLE).filter(p => p.active); }

function teamToday() {

// Where the day's pace is right now (0 → 1 across the 9a–6p workday).
function paceFraction() {
  const d = new Date(nowMs());
  const hours = d.getHours() + d.getMinutes() / 60;
  return Math.min(1, Math.max(0, (hours - WORKDAY_START) / (WORKDAY_END - WORKDAY_START)));
}
// Big team book-time bar: everyone active today with a goal, added together, vs where the team should be by now.
function renderTeamBook() {
  const pace = paceFraction();

    .map(x => { const book = computeTotals(x.id).book, goal = x.goal.book, expected = goal * pace; return { id: x.id, book, goal, expected, diff: book - expected }; });
  if (!people.length) return "";
  const G = people.reduce((a, x) => a + x.goal, 0), B = people.reduce((a, x) => a + x.book, 0), E = G * pace, diff = B - E;
  const showPct = E >= 15 * 60; // percentages vs pace only mean something once the day's underway
  const pctOf = v => (showPct ? (v / E) * 100 : 0);
  const fmtPct = v => (v >= 0 ? "+" : "−") + Math.abs(v).toFixed(Math.abs(v) < 10 ? 1 : 0) + "%";
  const ahead = diff >= 0;
  const chip = pace === 0
    ? `<span class="status-chip">Pace starts at 9a</span>`
    : `<span class="status-chip ${ahead ? "good" : "serious"}">${ahead ? "▲ Ahead" : "▼ Behind"} ${fmtHM(Math.abs(diff))}${showPct ? ` · ${fmtPct(pctOf(diff))}` : ""}</span>`;
  const maxAbs = Math.max(1, ...people.map(x => Math.abs(pctOf(x.diff))));
  const rows = people.slice().sort((a, b) => b.diff - a.diff).map(x => {

  return `

// Today's credit for one person. Resolved = tickets they're primary on (and hold a share of).
// Total = every ticket they got any credit for today: resolved, partial share, or diagnosis credit (even 0m).
function creditCounts(pid) {
  let resolved = 0; const all = new Set();
  for (const t of state.tickets) {
    const c = t.completion;
    if (c && c.shares.some(sh => sh.personId === pid)) { all.add(t.id); if (c.primaryPerson === pid) resolved++; }
    if ((t.workLog || []).some(w => w.personId === pid && w.date === state.today && w.outcome === "diagnosis_completed")) all.add(t.id);
  }
  return { resolved, total: all.size };
}

// Red = due today or overdue, yellow = due tomorrow (counts only; nothing shown when zero).

}

function parseHours(v) {
  const n = Number(String(v).trim().replace(/h(ours?)?$/i, "").trim());
  return Number.isFinite(n) && n >= 0 && n <= 24 ? Math.round(n * 60) : null;
}
function setRoleGoal(pos, field, val) {

  const book = field === "book" ? mins : Math.round(g.book / 60);
  const actual = field === "actual" ? mins : Math.round(g.spent / 60);
  mutate("/admin/role-goal", { position: pos, book, actual }, () => { GOALS[pos] = { book: book * 60, spent: actual * 60 }; });
}

// ---- PDF (jsPDF + autotable, loaded only when needed) ----
function loadScriptOnce(src) {
  return new Promise((resolve, reject) => {
    if (document.querySelector(`script[src="${src}"]`)) return resolve();
    const s = document.createElement("script"); s.src = src; s.onload = resolve; s.onerror = () => reject(new Error("Couldn't load the PDF maker"));
    document.head.appendChild(s);
  });
}
async function downloadReport() {
  const f = reportForm();
  if (!f.from || !f.to || f.from > f.to) { showToast("Pick a From date on or before the To date", "error"); return; }
  state.reportBusy = true; render();
  try {
    await loadScriptOnce("/vendor/jspdf.umd.min.js");
    await loadScriptOnce("/vendor/jspdf.plugin.autotable.min.js");
    const data = await api(`/admin/report?from=${f.from}&to=${f.to}`);
    const doc = f.type === "sales" ? buildSalesPdf(data, f) : buildTimePdf(data, f);
    const who = f.who === "all" ? "team" : (PEOPLE[f.who]?.name || f.who).split(" ")[0].toLowerCase();
    doc.save(`LR-${f.type}-${who}-${f.from}${f.to !== f.from ? "_to_" + f.to : ""}.pdf`);
    showToast("Report downloaded");
  } catch (e) { showToast(e.message, "error"); }
  finally { state.reportBusy = false; render(); }
}
function pdfStart(title, data, f) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: "pt", format: "letter" });
  const range = f.from === f.to ? shortDay(f.from) : `${shortDay(f.from)} – ${shortDay(f.to)}`;
  doc.setFont("helvetica", "bold"); doc.setFontSize(16); doc.text(`Lightning Repairs — ${title}`, 40, 48);
  doc.setFont("helvetica", "normal"); doc.setFontSize(10); doc.setTextColor(90);
  doc.text(`${range} · ${f.who === "all" ? "Whole team" : PEOPLE[f.who]?.name || f.who} · generated ${new Date().toLocaleString("en-US")}`, 40, 64);
  doc.setTextColor(0);
  return doc;
}
function pdfFinish(doc, note) {
  const pages = doc.getNumberOfPages();
  for (let i = 1; i <= pages; i++) {
    doc.setPage(i); doc.setFontSize(8); doc.setTextColor(120);
    if (note) doc.text(note, 40, doc.internal.pageSize.getHeight() - 24, { maxWidth: 440 });
    doc.text(`Page ${i} of ${pages}`, doc.internal.pageSize.getWidth() - 40, doc.internal.pageSize.getHeight() - 24, { align: "right" });
  }
  return doc;
}
const PDF_TABLE = { theme: "grid", styles: { fontSize: 9, cellPadding: 4 }, headStyles: { fillColor: [22, 50, 92] }, footStyles: { fillColor: [235, 240, 248], textColor: 20, fontStyle: "bold" }, margin: { left: 40, right: 40 } };
const sumInto = (acc, m, keys) => { for (const k of keys) acc[k] = (acc[k] || 0) + (m[k] || 0); return acc; };
const MONEY_KEYS = ["revenue", "profit", "cost", "labor", "laborQty", "invoices"];
const TIME_KEYS = ["bookSec", "actualSec", "resolved", "total"];
const nameOf = pid => PEOPLE[pid]?.name || pid;
function buildSalesPdf(data, f) {
  const doc = pdfStart("Sales report", data, f);
  const per = {}, others = {}, daily = [];
  for (const d of data.days) {
    const dayTot = {};
    for (const [pid, m] of Object.entries(d.people)) {
      if (f.who !== "all" && pid !== f.who) continue;
      if (!m.invoices) continue;
      sumInto(per[pid] ||= {}, m, MONEY_KEYS); sumInto(dayTot, m, MONEY_KEYS);
    }
    if (f.who === "all") for (const [n, m] of Object.entries(d.others || {})) { sumInto(others[n] ||= {}, m, MONEY_KEYS); sumInto(dayTot, m, MONEY_KEYS); }
    daily.push([shortDay(d.day), dayTot.invoices || 0, money$(dayTot.revenue), money$(dayTot.profit), pct$(dayTot.profit || 0, dayTot.revenue || 0), money$(dayTot.labor), qty$(dayTot.laborQty)]);
  }
  const row = (name, m) => [name, m.invoices || 0, money$(m.revenue), money$(m.profit), pct$(m.profit || 0, m.revenue || 0), money$(m.labor), qty$(m.laborQty)];
  const all = {};
  const body = Object.entries(per).sort((a, b) => (b[1].revenue || 0) - (a[1].revenue || 0)).map(([pid, m]) => { sumInto(all, m, MONEY_KEYS); return row(nameOf(pid), m); });
  for (const [n, m] of Object.entries(others)) { sumInto(all, m, MONEY_KEYS); body.push(row(`${n} (not in app)`, m)); }
  const head = [["", "Invoices", "Revenue", "Profit", "Margin", "Labor $", "Labor SKUs"]];
  head[0][0] = "Person";
  doc.autoTable({ ...PDF_TABLE, startY: 80, head, body: body.length ? body : [["No invoices in this range", "", "", "", "", "", ""]], foot: [row("Total", all)] });
  if (data.days.length > 1) {
    doc.setFontSize(11); doc.setFont("helvetica", "bold"); doc.text("By day", 40, doc.lastAutoTable.finalY + 24); doc.setFont("helvetica", "normal");
    doc.autoTable({ ...PDF_TABLE, startY: doc.lastAutoTable.finalY + 30, head: [["Day", "Invoices", "Revenue", "Profit", "Margin", "Labor $", "Labor SKUs"]], body: daily });
  }
  const since = data.salesSince ? ` Sales data is recorded from ${shortDay(data.salesSince)} on.` : "";
  return pdfFinish(doc, `Revenue = invoice subtotals before tax. Profit = revenue - line-item cost. Labor SKUs = items in RepairShopr's "${data.labor?.category || "Repair Service"}" category (and subcategories). Invoices count for whoever the ticket is assigned to (no ticket: invoice creator).${since}`);
}
function buildTimePdf(data, f) {
  const doc = pdfStart("Book time vs actual time", data, f);
  const per = {}, days = {};
  for (const d of data.days) for (const [pid, m] of Object.entries(d.people)) {
    if (f.who !== "all" && pid !== f.who) continue;
    if (!m.bookSec && !m.actualSec && !m.total) continue;
    const x = sumInto(per[pid] ||= {}, m, TIME_KEYS); x.days = (x.days || 0) + 1;
    (days[d.day] ||= []).push([pid, m]);
  }
  const eff = m => (m.actualSec > 0 ? Math.round((m.bookSec / m.actualSec) * 100) + "%" : "—");
  const row = (name, m, extra = []) => [name, ...extra, fmtHM(m.bookSec || 0), fmtHM(m.actualSec || 0), eff(m), m.resolved || 0, m.total || 0];
  const all = {}; let allDays = 0;
  const body = Object.entries(per).sort((a, b) => nameOf(a[0]).localeCompare(nameOf(b[0]))).map(([pid, m]) => { sumInto(all, m, TIME_KEYS); allDays += m.days; return row(nameOf(pid), m, [m.days]); });
  doc.autoTable({ ...PDF_TABLE, startY: 80, head: [["Person", "Days", "Book time", "Actual time", "Book ÷ actual", "Resolved", "Total tickets"]],
    body: body.length ? body : [["Nothing recorded in this range", "", "", "", "", "", ""]], foot: [row("Total", all, [allDays])] });
  if (data.days.length > 1 || f.who !== "all") {
    const dBody = [];
    for (const d of data.days) for (const [pid, m] of (days[d.day] || []).sort((a, b) => nameOf(a[0]).localeCompare(nameOf(b[0])))) dBody.push(row(shortDay(d.day), m, f.who === "all" ? [nameOf(pid)] : []));
    if (dBody.length) {
      doc.setFontSize(11); doc.setFont("helvetica", "bold"); doc.text("By day", 40, doc.lastAutoTable.finalY + 24); doc.setFont("helvetica", "normal");
      doc.autoTable({ ...PDF_TABLE, startY: doc.lastAutoTable.finalY + 30, head: [["Day", ...(f.who === "all" ? ["Person"] : []), "Book time", "Actual time", "Book ÷ actual", "Resolved", "Total tickets"]], body: dBody });
    }
  }
  return pdfFinish(doc, "Book time = credited minutes for resolved tickets (by credit share) + diagnosis credits. Actual time = app timer + RepairShopr timers + typed-in time. Resolved = primary on a resolved ticket. Total = every ticket with any credit, including diagnosis credit (even 0m).");
}

/* ---------- 🔧 Refurbs (app-only — RepairShopr's API has no refurbs) ----------
   Refurb objects look enough like tickets (id = -refurb id) to reuse the timer + actual-time cells. */
function buildRefurb(r) {
  const mapped = ISSUE_TYPE_TO_DEVICE[r.issueType];
  const x = { ...r, id: -r.id, refurbId: r.id, isRefurb: true, deviceCategory: mapped ? mapped.category : null,
    deviceSubtype: mapped ? (r.subtype && (r.subtype === mapped.subtype || (mapped.alt || []).includes(r.subtype)) ? r.subtype : mapped.subtype) : null,
    deviceRow: r.model || null };
  x.bookedSec = r.state === "done" && r.bookMinutes != null ? r.bookMinutes * 60 : refurbRepairs(x).reduce((a, rt) => a + (repairMinutesFor(x, rt) || 0), 0) * 60;
  return x;
}
const refurbRepairs = f => f.repairs || [];
function findRefurb(negId) { return (state.refurbs || []).find(f => f.id === negId); }
function addRefurb() {
  mutate("/refurb", { action: "create" }).then(r => { if (r) setTimeout(() => document.getElementById(`refurb-label-${r.id}`)?.focus(), 50); });
}
function refurbUpdate(negId, patch, optimistic) {
  const f = findRefurb(negId);
  mutate("/refurb", { action: "update", id: -negId, ...patch }, () => { if (f && optimistic) { optimistic(f); Object.assign(f, buildRefurb({ ...f, id: f.refurbId })); } });
}
function setRefurbLabel(negId, v) { refurbUpdate(negId, { label: v }, f => { f.label = v; }); }
function setRefurbType(negId, v) { refurbUpdate(negId, { issueType: v }, f => { f.issueType = v; f.model = null; f.subtype = null; f.repairs = []; }); }
function setRefurbModel(negId, v) {
  const [subtype, ...rest] = String(v).split("|"), model = rest.join("|");
  refurbUpdate(negId, { subtype, model }, f => { f.subtype = subtype; f.model = model; f.repairs = []; });
}
function addRefurbRepair(negId, rt) {
  const f = findRefurb(negId); if (!f || !rt) return;
  const next = [...new Set([...refurbRepairs(f), rt])];
  refurbUpdate(negId, { repairs: next }, x => { x.repairs = next; });
}
function removeRefurbRepair(negId, rt) {
  const f = findRefurb(negId); if (!f) return;
  const next = refurbRepairs(f).filter(x => x !== rt);
  refurbUpdate(negId, { repairs: next }, x => { x.repairs = next; });
}
function completeRefurb(negId) {
  const f = findRefurb(negId);
  if (!f.model || !refurbRepairs(f).length) { showToast("Pick the model and at least one repair first", "error"); return; }
  mutate("/refurb", { action: "complete", id: -negId }, () => { f.state = "done"; f.doneAt = nowMs(); finalizeElapsed(f); f.timerState = "logged"; })
    .then(r => { if (r) showToast(`Refurb complete — ${r.minutes}m book time`); });
}
function reopenRefurb(negId) { mutate("/refurb", { action: "reopen", id: -negId }, () => { findRefurb(negId).state = "open"; }); }
function deleteRefurb(negId) {
  const f = findRefurb(negId);
  if (!confirm(`Delete this refurb${f.label ? ` (${f.label})` : ""}? Its timer time is deleted too.`)) return;
  mutate("/refurb", { action: "delete", id: -negId }, () => { state.refurbs = state.refurbs.filter(x => x.id !== negId); });
}
function renderRefurbDevice(f) {
  const done = f.state === "done";
  const typeOpts = RS_ISSUE_TYPES.map(it => `<option value="${esc(it)}" ${f.issueType === it ? "selected" : ""}>${ISSUE_TYPE_ICONS[it] || ""} ${esc(it)}</option>`).join("");
  const mapped = ISSUE_TYPE_TO_DEVICE[f.issueType];
  const cat = mapped && state.bookTimeCategories[mapped.category];
  const subKeys = mapped && cat ? [mapped.subtype, ...(mapped.alt || [])].filter(k => cat.subtypes[k]) : [];
  const opt = (k, r) => `<option value="${esc(k + "|" + r)}" ${f.deviceSubtype === k && f.deviceRow === r ? "selected" : ""}>${esc(r)}</option>`;
  const modelOpts = subKeys.length === 1 ? cat.subtypes[subKeys[0]].rows.map(r => opt(subKeys[0], r)).join("")
    : subKeys.map(k => `<optgroup label="${esc(cat.subtypes[k].label)}">${cat.subtypes[k].rows.map(r => opt(k, r)).join("")}</optgroup>`).join("");
  const have = new Set(refurbRepairs(f));
  const repairOpts = repairColumnsFor(f).filter(c => !have.has(c)).map(c => `<option value="${esc(c)}">${esc(c)}${repairMinutesFor(f, c) ? ` (${repairMinutesFor(f, c)}m)` : ""}</option>`).join("");
  const chips = refurbRepairs(f).map(rt => `<span class="refurb-chip">${esc(rt)} <b>${repairMinutesFor(f, rt) ?? 0}m</b>${done ? "" : `<button type="button" onclick="removeRefurbRepair(${f.id}, ${jsArg(rt)})" title="Remove">✕</button>`}</span>`).join("");
  return `
    <div class="tcell-device refurb-device">
      <select class="device-select" onchange="setRefurbType(${f.id}, this.value)" ${done ? "disabled" : ""}>
        <option value="" ${!f.issueType ? "selected" : ""} disabled>Device type…</option>${typeOpts}
      </select>
      <select class="device-select" onchange="setRefurbModel(${f.id}, this.value)" ${subKeys.length && !done ? "" : "disabled"}>
        <option value="" ${!f.deviceRow ? "selected" : ""} disabled>Model…</option>${modelOpts}
      </select>
      <select class="device-select" onchange="addRefurbRepair(${f.id}, this.value)" ${f.deviceRow && !done ? "" : "disabled"}>
        <option value="" selected disabled>${refurbRepairs(f).length ? "+ Add repair…" : "Repair…"}</option>${repairOpts}
      </select>
      ${chips ? `<div class="refurb-chips">${chips}</div>` : ""}
    </div>`;
}
function renderRefurbRow(f) {
  const done = f.state === "done";
  const running = f.timerState === "running", paused = f.timerState === "paused", logged = f.timerState === "logged";
  const controls = done ? "" : running
    ? `<button class="icon-btn stop" onclick="toggleTimer(${f.id},'pause')" title="Pause">❚❚</button>
       <button class="icon-btn stop" onclick="toggleTimer(${f.id},'stop')" title="Stop &amp; log time">■</button>`
    : `<button class="icon-btn play" onclick="toggleTimer(${f.id},'start')" title="${logged ? "Start a new timer segment" : paused ? "Resume" : "Start"}">▶</button>
       ${paused ? `<button class="icon-btn stop" onclick="toggleTimer(${f.id},'stop')" title="Stop &amp; log time">■</button>` : ""}`;
  const labelCell = done
    ? `<div class="refurb-label"><div class="ticket-num">🔧 Refurb</div><div class="ticket-subject">${esc(f.label || "(no refurb # / serial)")}</div></div>`
    : `<div class="refurb-label"><div class="ticket-num">🔧 Refurb</div>
        <input id="refurb-label-${-f.id}" class="refurb-input" type="text" maxlength="80" placeholder="Refurb # / IMEI / serial" value="${esc(f.label || "")}" onchange="setRefurbLabel(${f.id}, this.value)" onkeydown="if (event.key === 'Enter') this.blur()"></div>`;
  const doneTime = f.doneAt ? new Date(f.doneAt).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" }) : "";
  return `
    <div class="trow refurb-row ${done ? "done" : ""}" data-id="${f.id}">
      ${labelCell}
      <div></div>
      <span class="ticket-status ${done ? "status-done" : ""}">${done ? `✓ ${esc(doneTime)}` : "In progress"}</span>
      ${renderRefurbDevice(f)}
      <div class="tcell-book" title="Sum of the picked repairs from the Book Time Database${done ? " (locked in when completed)" : ""}">${f.bookedSec ? fmtHM(f.bookedSec) : "—"}</div>
      ${renderActualCell(f, controls)}
      <div class="ticket-actions">${done ? "" : `<button class="icon-btn" onclick="deleteRefurb(${f.id})" title="Delete this refurb">🗑</button>`}</div>
      <div class="tcell-outcome">${done
        ? `<button class="btn ghost small" onclick="reopenRefurb(${f.id})" title="Take the credit back off so it can be changed">Undo</button>`
        : `<button class="btn small primary" onclick="completeRefurb(${f.id})" ${f.deviceRow && refurbRepairs(f).length ? "" : `disabled title="Pick the model and at least one repair first"`}>✓ Complete refurb</button>`}</div>
    </div>`;
}
function renderRefurbSection() {
  const list = state.refurbs || [];
  const open = list.filter(f => f.state !== "done"), done = list.filter(f => f.state === "done");
  const doneMin = done.reduce((a, f) => a + (f.bookMinutes || 0), 0);
  return `
    <div class="panel refurb-panel">
      <div class="refurb-head">
        <h2>🔧 Refurbs ${done.length ? `<span class="meter-note" style="display:inline">&mdash; ${done.length} completed today · ${fmtHM(doneMin * 60)} book time</span>` : ""}</h2>
        <button class="btn small primary" onclick="addRefurb()">+ Add refurb</button>
      </div>
      ${list.length ? `<div class="trow thead"><div>Refurb</div><div></div><div>Status</div><div>Type · Model · Repairs</div><div class="h-book">📖 Book</div><div class="h-actual">⏱ Actual</div><div></div><div></div></div>` : ""}
      ${open.map(renderRefurbRow).join("")}
      ${done.map(renderRefurbRow).join("")}
      ${list.length ? "" : `<div class="meter-note">Working a refurb? Add it here, run the timer, and complete it to get its book time.</div>`}
    </div>`;
}

/* ---------- 💳 Card sales reports (Valor) — Sales / Float / Assistant Manager / Manager, or admins ----------
   No live numbers: pick a reader, click a button, get a PDF pulled from Valor at that moment. */
const CARD_SALES_ROLES = ["Sales", "Float", "Assistant Manager", "Manager"];
function canSeeCardSales() {
  const u = state.currentUser;
  return !!u && (u.admin || (u.positions || []).some(p => CARD_SALES_ROLES.includes(p)));
}
/* ---------- LR Apps: a home screen of small tools. Everyone sees every app; locked ones are greyed out. ---------- */
const LR_APPS = [
  { key: "cards", name: "Download CC Report", icon: "💳", color: "#1f8f5f", can: () => canSeeCardSales(),
    locked: "Needs the Sales, Float, Assistant Manager or Manager role", render: () => renderCardSalesTab(), open: () => loadCardInfo() },
];
function openApp(key) {
  const app = LR_APPS.find(a => a.key === key);
  if (!app || !app.can()) return;
  state.tab = "apps"; state.appOpen = key; navigate();
}
function closeApp() { state.appOpen = null; navigate(); }
function renderApps() {
  const app = state.appOpen && LR_APPS.find(a => a.key === state.appOpen && a.can());
  if (app) return `<div class="breadcrumb"><button class="btn ghost small" onclick="closeApp()">&larr; LR Apps</button></div>${app.render()}`;
  const tiles = LR_APPS.map(a => {
    const ok = a.can();
    return `<button type="button" class="app-tile ${ok ? "" : "locked"}" ${ok ? `onclick="openApp('${a.key}')"` : "disabled"} title="${esc(ok ? a.name : a.locked)}">
      <span class="app-icon-wrap"><span class="app-icon" style="background:${a.color}">${a.icon}</span>${ok ? "" : `<span class="app-lock">🔒</span>`}</span>
      <span class="app-name">${esc(a.name)}</span>
    </button>`;
  }).join("");
  return `<div class="panel apps-panel"><h2>LR Apps</h2><div class="app-grid">${tiles}</div></div>`;
}
const usd = c => "$" + ((Number(c) || 0) / 100).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
async function loadCardInfo() {
  try { state.cardInfo = await api("/card-sales/info"); state.cardError = null; }
  catch (e) { state.cardError = e.message; }
  if (state.tab === "apps") render();
}
function pickCardReader(id) { state.cardReader = id; }
function renderCardSalesTab() {
  const info = state.cardInfo;
  if (!info) { if (!state.cardError) setTimeout(loadCardInfo, 0); return `<div class="panel"><h2>💳 Card sales reports</h2><div class="meter-note">${state.cardError ? `<span class="bad-text">${esc(state.cardError)}</span>` : "Loading…"}</div></div>`; }
  if (!info.configured) return `<div class="panel"><h2>💳 Card sales reports</h2><div class="meter-note">Valor isn't connected yet. Add <b>VALOR_APP_ID</b>, <b>VALOR_APP_KEY</b> and <b>VALOR_EPI</b> in Netlify → Environment variables, then redeploy.</div></div>`;
  const readers = info.readers;
  if (!state.cardReader || (state.cardReader !== "all" && !readers.some(r => r.id === state.cardReader))) state.cardReader = readers[0].id; // default: Reader 1
  const busy = state.cardBusy;
  const btn = (day, label) => `<button class="btn ${day === info.today ? "primary" : ""}" onclick="downloadCardReport('${day}')" ${busy ? "disabled" : ""}>${busy === day ? "Pulling from Valor…" : `⬇ ${label}`}</button>`;
  return `
    <div class="panel">
      <h2>💳 Download CC Report</h2>
      <div class="report-field" style="margin-bottom:12px"><span class="report-label" style="grid-row:auto">Reader</span>
        <select id="card-reader" class="setting-select" style="justify-self:start" onchange="pickCardReader(this.value)" ${busy ? "disabled" : ""}>
          ${readers.map(r => `<option value="${esc(r.id)}" ${state.cardReader === r.id ? "selected" : ""}>${esc(r.name)}</option>`).join("")}
          ${readers.length > 1 ? `<option value="all" ${state.cardReader === "all" ? "selected" : ""}>All readers</option>` : ""}
        </select>
      </div>
      <div class="card-actions">
        ${btn(info.today, "Download today's report")}
        ${btn(info.previous, `Download previous day's report (${shortDay(info.previous)})`)}
      </div>
      ${state.cardError ? `<div class="bad-text" style="font-size:12.5px;margin-top:10px">${esc(state.cardError)}</div>` : ""}
      <div class="meter-note" style="margin-top:10px">Pulled from Valor when you click. Voids are left out of the total; refunds are subtracted. No card numbers or transaction ids are included. Only today and the previous business day are available.</div>
    </div>`;
}
async function downloadCardReport(day) {
  if (state.cardBusy) return;
  const reader = state.cardReader || "1";
  state.cardBusy = day; state.cardError = null; render();
  try {
    const d = await api(`/card-sales?day=${encodeURIComponent(day)}&reader=${encodeURIComponent(reader)}`);
    await loadScriptOnce("/vendor/jspdf.umd.min.js");
    await loadScriptOnce("/vendor/jspdf.plugin.autotable.min.js");
    cardPdf(d).save(`LR-card-sales-${d.day}-${cardReaderSlug(d)}.pdf`);
    showToast(`Downloaded — ${d.salesCount} sale${d.salesCount === 1 ? "" : "s"}, net ${usd(d.netCents)}`);
    if (d.warning) state.cardError = d.warning;
  } catch (e) { state.cardError = e.message; }
  finally { state.cardBusy = null; render(); }
}
const cardReaderLabel = d => (d.reader ? (d.readers.find(r => r.id === d.reader) || {}).name || "Reader" : "All readers");
const cardReaderSlug = d => cardReaderLabel(d).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "reader";
function cardPdf(d) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: "pt", format: "letter" });
  doc.setFont("helvetica", "bold"); doc.setFontSize(16); doc.text("Lightning Repairs - Card sales", 40, 48);
  doc.setFont("helvetica", "normal"); doc.setFontSize(10); doc.setTextColor(90);
  doc.text(`${shortDay(d.day)} · ${cardReaderLabel(d)} · generated ${new Date().toLocaleString("en-US")} by ${state.currentUser.name}`, 40, 64);
  doc.setTextColor(0);
  const summary = [["Sales", String(d.salesCount), usd(d.salesCents)], ["Refunds", String(d.refundCount), d.refundCount ? "-" + usd(d.refundCents) : usd(0)], ["Voided (not counted)", String(d.voidCount), ""]];
  doc.autoTable({ ...PDF_TABLE, startY: 80, head: [["", "Count", "Amount"]], body: summary, foot: [["Net card sales", "", usd(d.netCents)]], tableWidth: 300 });
  if (d.byBrand.length) doc.autoTable({ ...PDF_TABLE, startY: doc.lastAutoTable.finalY + 14, head: [["Card", "Net"]], body: d.byBrand.map(b => [b.brand, usd(b.cents)]), tableWidth: 300 });
  doc.setFontSize(11); doc.setFont("helvetica", "bold"); doc.text("Transactions", 40, doc.lastAutoTable.finalY + 24); doc.setFont("helvetica", "normal");
  const multi = !d.reader;
  doc.autoTable({ ...PDF_TABLE, startY: doc.lastAutoTable.finalY + 30, head: [["Time", ...(multi ? ["Reader"] : []), "Type", "Card", "Card type", "Amount"]],
    body: d.txns.length ? d.txns.map(t => [t.time || "", ...(multi ? [t.reader] : []), t.type === "sale" ? "Sale" : t.type === "refund" ? "Refund" : "Voided", t.scheme || "", t.cardType || "", (t.type === "refund" ? "-" : "") + usd(Math.abs(t.amount)) + (t.type === "void" ? " (void)" : "")])
      : [["No card transactions", ...(multi ? [""] : []), "", "", "", ""]],
    columnStyles: { [multi ? 5 : 4]: { halign: "right" } } });
  return pdfFinish(doc, `From the Valor card terminal${d.warning ? " (partial: " + d.warning + ")" : ""}. Voids are left out of the total; refunds are subtracted. Card numbers and transaction ids are not included.`);
}

function renderSettings() {
  return `
    <div class="panel">
      <h2>Settings</h2>
      <div class="setting-row">
        <div>
          <div class="setting-label">Appearance</div>
          <div class="meter-note">Your pick is remembered on this device.</div>
        </div>
        <div class="theme-toggle">
          ${THEMES.map(t => `<button class="theme-toggle-btn ${state.theme === t.key ? 'active' : ''}" onclick="setTheme('${t.key}')">${t.label}</button>`).join("")}
        </div>
      </div>
      <div class="setting-row" style="border-top:1px solid var(--grid); margin-top:10px; padding-top:14px">
        <div>
          <div class="setting-label">My Day order</div>
          <div class="meter-note">How "Your assigned tickets" is sorted — just for you.</div>
        </div>
        <select id="sort-mode" class="setting-select" onchange="setSortMode(this.value); this.blur()">
          ${SORT_MODES.map(m => `<option value="${m.key}" ${state.sortMode === m.key ? "selected" : ""}>${esc(m.label)}</option>`).join("")}
        </select>
      </div>
    </div>
  `;
}
function setTheme(mode) {
  state.theme = mode;
  store.set("lr_theme", mode);
  document.documentElement.setAttribute('data-theme', mode);
  render();
}

/* ---------- boot ---------- */
document.documentElement.setAttribute('data-theme', state.theme);
render();
(async () => {
  if (!state.token) { state.screen = "login"; render(); return; }
  try { await enterApp(); }
  catch (e) {
    if (state.screen !== "login") { state.screen = "login"; state.loginError = e.message; render(); }
  }
})();
</script>
</body>
